# The network tool: the IP, DNS and routing aliases, and the tasks ips:*. Each
# network package (doggo, gping, httping, ipcalc, prettyping) and Tailscale is
# a tool of its own. The task ips:remoteip runs doggo, so this tool depends on
# doggo. The [mise.*] tables become ~/.config/mise/conf.d/network/mise.toml.

category = "system"
depends = [ "doggo" ]
description = "the ips:* tasks and the IP, DNS and routing aliases"
summary = "The ips:* tasks and the network aliases"

[mise.shell_alias]
# IP related shortcuts
gateway = "mise run ips:gateway"
ii = "mise run ips:ii"
ips = "mise run ips:ips"
ipv4 = "mise run ips:ipv4"
ipv6 = "mise run ips:ipv6"
remoteip = "mise run ips:remoteip"

# DNS & routing
dns = "scutil --dns"
flushdns = "dscacheutil -flushcache"
ipInfo0 = "ipconfig getpacket en0"
openports = "sudo lsof -i -P | grep LISTEN"
routes = "netstat -nr -f inet"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."ips/gateway"]
source = "ips-gateway"

[tasks."ips/ii"]
source = "ips-ii"

[tasks."ips/ips"]
source = "ips-ips"

[tasks."ips/ipv4"]
source = "ips-ipv4"

[tasks."ips/ipv6"]
source = "ips-ipv6"

[tasks."ips/remoteip"]
source = "ips-remoteip"
