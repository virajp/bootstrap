# The gh tool: the GitHub CLI and its config file. The editor that gh runs is
# a question. The [mise.*] tables become ~/.config/mise/conf.d/gh/mise.toml.

category = "dev"
depends = [ "git" ]
description = "the GitHub CLI (gh) and its config: ssh as git protocol, the editor, the aliases"
summary = "The GitHub CLI and its config"

[questions.editor]
detect = "git config --global core.editor"
example = "code"
question = "Which editor command should gh run for issue and pull request text (for example code, zed, vim)?"

# gh config set rewrites the file, so it is a shared file: the spec adds only
# the keys of bootstrap; gh owns every other key.
[mise.bootstrap.packages]
"brew:gh" = "latest" # GitHub CLI tool

# The files of the tool, below files/.
[files.".config/gh/config.yml"]
mode = "merge"
source = ".config/gh/config.yml.merge.toml"
