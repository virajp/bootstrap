# The zsh tool: ~/.zshenv, ~/.zshrc and its own drop-ins in ~/.config/zsh/
# (00-bootstrap, 98-zinit, 99-zsh). Other tools add their drop-ins to
# ~/.config/zsh/ (homebrew, mise, cli, starship). ~/.zprofile belongs to the
# mise tool. The [mise.*] tables install Homebrew's zsh and zinit and add zsh to
# /etc/shells. They become ~/.config/mise/conf.d/zsh/mise.toml.
depends = [ "homebrew", "mise", "macos-setup" ]
description = "zsh from Homebrew with zinit, its rc files and its drop-in folder ~/.config/zsh/"
stage = "init"

[mise.bootstrap.packages]
"brew:zinit" = "latest" # Zsh plugin manager
"brew:zsh" = "latest"

# /etc/shells is outside $HOME, so it stays a mise declaration.
[mise.dotfiles]
"/etc/shells/brew-zsh" = { line = "/opt/homebrew/bin/zsh" }

# The files of the tool, below files/.
[files.".config/zsh/00-bootstrap.zsh"]
source = ".config/zsh/00-bootstrap.zsh"

[files.".config/zsh/98-zinit.zsh"]
source = ".config/zsh/98-zinit.zsh"

[files.".config/zsh/99-zsh.zsh"]
source = ".config/zsh/99-zsh.zsh"

[files.".zshenv"]
source = ".zshenv"

[files.".zshrc"]
source = ".zshrc"
