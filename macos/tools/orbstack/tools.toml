# The orbstack tool.

category = "dev"
description = "OrbStack (Docker and Kubernetes), its env, the docker and kubectl aliases, its fish and zsh init and its ssh Include"
summary = "OrbStack, for Docker and Kubernetes"

# OrbStack's `orb` SSH host: an Include at the top of ~/.ssh/config, before any
# Host block. The ssh tool's template places it.
[contributes.ssh]
includes = [ "~/.orbstack/ssh/config" ]

[mise.bootstrap.packages]
"brew-cask:orbstack" = "latest" # Replacement for Docker Desktop

[mise.env]
# Docker
BUILDKIT_PROGRESS = "auto"
COMPOSE_DOCKER_CLI_BUILD = "1"
DOCKER_BUILDKIT = "1"
DOCKER_DEFAULT_PLATFORM = "linux/amd64"
DOCKER_HIDE_LEGACY_COMMANDS = "1"

# Helm
HELM_EXPERIMENTAL_OCI = "1"

[mise.shell_alias]
# Docker Related Aliases
dclean = "docker system prune --all --volumes --force"
dlist = "docker image list"
dprune = "docker system prune --volumes --force"
dpull = "docker image pull --platform='linux/amd64'"
drun = "docker run --platform='linux/amd64' --rm --interactive --tty"

# Kubernetes (K8s) Related Aliases
k = "kubectl"
kc-local = "kubectl config use-context orbstack"
kgc = "kubectl config current-context"
kubectx = "kubectl config get-contexts"

# The files of the tool, below files/.
[files.".config/fish/conf.d/90-orbstack.fish"]
source = ".config/fish/conf.d/90-orbstack.fish"

[files.".config/zsh/90-orbstack.zsh"]
source = ".config/zsh/90-orbstack.zsh"
