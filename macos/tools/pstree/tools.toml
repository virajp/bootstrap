# The pstree tool: pstree (shows the process tree), the func:myps task and its
# myps alias.

category = "cli"
description = "pstree, the process tree, with the func:myps task and its myps alias"
summary = "pstree, the process tree"

[mise.bootstrap.packages]
"brew:pstree" = "latest" # Display process tree

[mise.shell_alias]
myps = "mise run func:myps"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."func/myps"]
source = "func-myps"
