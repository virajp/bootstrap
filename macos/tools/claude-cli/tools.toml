# The claude-cli tool: Claude Code, its ~/.claude files (settings, CLAUDE.md,
# output styles), the func:claude and upgrade:ai tasks and the cc* aliases. The
# task upgrade:ai runs jq, so this tool depends on jq.

depends = [ "cli", "jq" ]
description = "Claude Code: its settings, CLAUDE.md, output styles, the func:claude and upgrade:ai tasks and the cc* aliases"

# Claude Code rewrites CLAUDE.md, so it is a seed: written once and then owned
# by the user. settings.json is a shared file: bootstrap adds the keys and list
# items of its merge spec, and Claude Code owns the rest.
# The claude-cli tool: Claude Code and its aliases.
[mise.bootstrap.packages]
"brew-cask:claude-code@latest" = "latest" # Claude Code latest version

[mise.shell_alias]
# Claude Code shortcuts
cc = "mise run --silent func:claude"
ccf = "mise run --silent func:claude --model 'fable[1m]'"
cch = "mise run --silent func:claude --model 'haiku[1m]'"
cco = "mise run --silent func:claude --model 'opus[1m]'"
ccs = "mise run --silent func:claude --model 'sonnet[1m]'"

# The files of the tool, below files/.
[files.".claude/CLAUDE.md"]
mode = "seed"
source = ".claude/CLAUDE.md"

[files.".claude/output-styles/ste100.md"]
source = ".claude/output-styles/ste100.md"

[files.".claude/output-styles/terse.md"]
source = ".claude/output-styles/terse.md"

[files.".claude/settings.json"]
mode = "merge"
source = ".claude/settings.json.merge.toml"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."func/claude"]
source = "func-claude"

[tasks."upgrade/ai"]
source = "upgrade-ai"
