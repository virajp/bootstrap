value = "**Trusted repo**: ${HOME}/Projects/github.com/virajp/claude-plugins (working directory) and its origin remote github.com:virajp/claude-plugins.git — PUBLIC, so only this repo's own work belongs in commits/pushes here; confidential material (secrets, sensitive data) is never cleared into it by visibility alone"
[[item]]
kind = "item"
