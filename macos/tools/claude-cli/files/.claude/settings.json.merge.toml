# The merge spec of ~/.claude/settings.json, a shared file. Claude Code
# rewrites the file, so bootstrap adds only its own keys and list items. A key
# that the user or Claude Code changes keeps its value. The sync renders this
# spec with the values of the tool.

# The keys of bootstrap. Each leaf is one key. The tool installs Claude Code
# with Homebrew, so Claude Code does not update itself.
[[item]]
kind = "keys"

[item.value]
"$schema" = "https://json.schemastore.org/claude-code-settings.json"

[item.value.env]
CLAUDE_INSTALL_METHOD = "other"
DISABLE_AUTOUPDATER = "1"

# The keys of the user: settings in [tools.claude-cli] of macos.toml. Each
# leaf is one key.
<%- if .config.settings %>
[[item]]
kind = "keys"
value = <% .config.settings | data.ToTOMLInline %>
<%- end %>

# The list items of the user: lists in [tools.claude-cli] of macos.toml. Each
# key is a dotted path, for example "permissions.allow", and each item of its
# list is added once. An item that the user adds in Claude Code stays.
<%- range $path, $items := .config.lists %>
<%- range $items %>
[[item]]
kind = "item"
path = <% strings.Split "." $path | data.ToTOMLInline %>
value = <% . | data.ToTOMLInline %>
<%- end %>
<%- end %>

# The status line and the hook of claude-status, when that tool is selected.
<%- if coll.Has .tools "claude-status" %>
[[item]]
kind = "keys"
path = [ "statusLine" ]

[item.value]
command = "claude-status --statusline"
padding = 0
refreshInterval = 4
type = "command"

[[item]]
kind = "keys"
path = [ "subagentStatusLine" ]

[item.value]
command = "claude-status --subagent"
type = "command"

[[item]]
kind = "block"
path = [ "hooks", "PostToolUse" ]
id = "claude-status"
match = [ "hooks.command" ]
value = { hooks = [ { command = "claude-status --caps-hook", type = "command" } ] }
<%- end %>

# Keys that bootstrap set before and no longer sets.
[[item]]
kind = "key"
path = [ "deniedMcpServers" ]
"$mode" = "remove"

[[item]]
kind = "key"
path = [ "env", "CONTEXT7_RUNNER" ]
"$mode" = "remove"
