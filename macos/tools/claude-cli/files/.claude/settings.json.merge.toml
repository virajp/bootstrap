# The merge spec of ~/.claude/settings.json, a shared file. Claude Code
# rewrites the file, so bootstrap adds only its own keys and list items. A key
# that the user or Claude Code changes keeps its value. The sync renders this
# spec with the values of the tool.
<%- $projects := index .all.cli "projects_dir" | required "cli: set projects_dir in [tools.cli] of macos.toml" -%>
<%- if strings.HasPrefix "~" $projects -%><%- $projects = print .env.HOME (strings.TrimPrefix "~" $projects) -%><%- end -%>

# The keys of bootstrap. Each leaf is one key.
[[item]]
kind = "keys"

[item.value]
"$schema" = "https://json.schemastore.org/claude-code-settings.json"
agentPushNotifEnabled = true
cleanupPeriodDays = 30
disableClaudeAiConnectors = true
disableArtifact = false
effortLevel = "medium"
forceLoginMethod = "claudeai"
includeCoAuthoredBy = true
inputNeededNotifEnabled = true
model = "opus[1m]"
outputStyle = "STE100"
respectGitignore = true
skipDangerousModePermissionPrompt = true
spinnerTipsEnabled = false
terminalProgressBarEnabled = true
theme = "dark"
tui = "fullscreen"

[item.value.attribution]
commit = ""
sessionUrl = false

[item.value.enabledPlugins]
"brag@brag" = true
"impeccable@impeccable" = true
"stackgen@virajp-plugins" = true
"taste-skill@taste-skill" = true
"vwf-tools@vwf-tools" = false
"vwf@virajp-plugins" = true

[item.value.extraKnownMarketplaces.brag.source]
repo = "latent-spaces/brag"
source = "github"

[item.value.extraKnownMarketplaces.claude-plugins-official.source]
repo = "anthropics/claude-plugins-official"
source = "github"

[item.value.extraKnownMarketplaces.impeccable.source]
source = "git"
url = "https://github.com/pbakaus/impeccable.git"

[item.value.extraKnownMarketplaces.virajp-plugins.source]
path = "${HOME}/Projects/github.com/virajp/claude-plugins/.dev-marketplace"
source = "directory"

[item.value.extraKnownMarketplaces.vwf-tools.source]
path = "<% .env.HOME %>/.claude/plugins/local/vwf-tools"
source = "directory"

[item.value.env]
AI_PLUGINS_USAGE_DIR = "${HOME}/.claude/usage"
ANTHROPIC_DEFAULT_FABLE_MODEL = "claude-fable-5-1"
CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY = "1"
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"
CLAUDE_INSTALL_METHOD = "other"
DISABLE_AUTOUPDATER = "1"
MISE_ENV = "dev"
MISE_TRUSTED_CONFIG_PATHS = "<% .env.HOME %>/.config/mise:<% $projects %>/github.com:<% $projects %>/gitlab.com"

[item.value.modelSettings]

[item.value.modelSettings.claude-opus-5]
effortLevel = "medium"

[item.value.skillOverrides]
"anthropic-skills:computer-use" = "off"
"anthropic-skills:deep-research" = "off"
"anthropic-skills:doc-coauthoring" = "off"
"anthropic-skills:docs" = "off"
"anthropic-skills:docx" = "off"
"anthropic-skills:import-memory" = "off"
"anthropic-skills:morning" = "off"
"anthropic-skills:pdf" = "off"
"anthropic-skills:pptx" = "off"
"anthropic-skills:skill-creator" = "off"
"anthropic-skills:xlsx" = "off"
google-workspace = "off"

