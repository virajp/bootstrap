# The status line and the hook of claude-status, when that tool is selected.
<%- if coll.Has .tools "claude-status" %>
[[item]]
kind = "keys"
path = [ "statusLine" ]

[item.value]
command = "claude-status --statusline"
padding = 0
refreshInterval = 4
type = "command"

[[item]]
kind = "keys"
path = [ "subagentStatusLine" ]

[item.value]
command = "claude-status --subagent"
type = "command"

[[item]]
kind = "block"
path = [ "hooks", "PostToolUse" ]
id = "claude-status"
match = [ "hooks.command" ]
value = { hooks = [ { command = "claude-status --caps-hook", type = "command" } ] }
<%- end %>

# Keys that bootstrap set before and no longer sets.
[[item]]
kind = "key"
path = [ "deniedMcpServers" ]
"$mode" = "remove"

[[item]]
kind = "key"
path = [ "env", "CONTEXT7_RUNNER" ]
"$mode" = "remove"
