# The ghostty tool. Its config uses the MesloLGS Nerd Font, so it depends on
# fonts.

depends = [ "fonts" ]
description = "Ghostty, the terminal emulator, and its config"

[mise.bootstrap.packages]
"brew-cask:ghostty" = "latest" # Terminal emulator

# The files of the tool, below files/.
[files.".config/ghostty/config"]
source = ".config/ghostty/config"
