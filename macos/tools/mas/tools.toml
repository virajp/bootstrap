# The mas tool: the Mac App Store command-line interface. The [mise.*] tables
# become ~/.config/mise/conf.d/mas/mise.toml.
category = "system"
description = "Mac App Store command-line interface"
summary = "mas, the Mac App Store CLI"

# The line of the mas tool in the Claude skill of mise.
[contributes.mise.skill.lines]
mas = "Mac App Store: an app is `mas:<id>`, for example `mas:361285480`."

[mise.bootstrap.packages]
"brew:mas" = "latest" # Mac App Store command-line interface
