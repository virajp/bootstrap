# The diff-so-fancy tool: diff-so-fancy, the git diff formatter. The [mise.*]
# tables become ~/.config/mise/conf.d/diff-so-fancy/mise.toml.
description = "diff-so-fancy, the git diff formatter (the pager of the git config)"

[mise.bootstrap.packages]
"brew:diff-so-fancy" = "latest" # Enhances git diff output
