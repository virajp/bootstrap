# The telegram tool: Telegram, from the Mac App Store.

depends = [ "mas" ]
description = "Telegram, from the Mac App Store"

[mise.bootstrap.packages]
"mas:747648890" = "latest" # Telegram

[mise.shell_alias]
cleanupTelegram = "mise run cleanupTelegram"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."cleanupTelegram"]
source = "cleanupTelegram"
