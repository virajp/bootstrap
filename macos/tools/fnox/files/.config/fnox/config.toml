# :schema https://fnox.jdx.dev/schema.json
# Synced from bootstrap: macos/tools/fnox/files/.config/fnox/config.toml. Do not edit this file.
# The next sync writes it again, and each change in this file is lost.

# Nothing is exported to the shell
env = false
# If a secret is missing, this determines the behavior
if_missing = "error"

[providers.global]
prefix = "global/"
service = "fnox"
type = "keychain"

# [secrets.GITHUB_API_TOKEN]
# provider = "global"
# value = "GITHUB_API_TOKEN"

[profiles.brew.secrets.GITHUB_API_TOKEN]
env = "exec"
provider = "global"
value = "GITHUB_API_TOKEN"

[profiles.brew.secrets.HOMEBREW_GITHUB_API_TOKEN]
env = "exec"
provider = "global"
value = "GITHUB_API_TOKEN"

[profiles.fnox.secrets.AGE_KEY]
env = "exec"
provider = "global"
value = "AGE_KEY"
