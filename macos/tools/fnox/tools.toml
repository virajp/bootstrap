# The fnox tool: fnox and the fnox config (secrets in the macOS
# Keychain, one profile for each consumer: brew, fnox). The [mise.*] tables
# become ~/.config/mise/conf.d/fnox/mise.toml.
description = "fnox: secrets from the macOS Keychain, with a profile per consumer"

[mise.bootstrap.packages]
"brew:fnox" = "latest" # Secret management tool

# The files of the tool, below files/.
[files.".config/fnox/config.toml"]
source = ".config/fnox/config.toml"
