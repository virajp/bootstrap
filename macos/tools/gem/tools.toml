# The gem tool.

description = "The RubyGems config (~/.gemrc): no documentation on install and update"

# gem rewrites it (gem sources), so it is a shared file: the spec adds only
# the keys of bootstrap. The file has no extension, so the spec sets its
# format.

# The files of the tool, below files/.
[files.".gemrc"]
mode = "merge"
source = "gemrc.merge.toml"
