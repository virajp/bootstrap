# The merge spec of the superfile config, a shared file. superfile rewrites
# its config, so bootstrap adds only these keys; superfile owns every other
# key. All keys: https://superfile.dev/configure/superfile-config/

# A partial config is valid: superfile uses its default for a missing key.
# code_previewer: "" for builtin chroma, "bat" for bat. default_sort_type:
# 0 Name, 1 Size, 2 Date Modified, 3 Type, 4 Natural. file_size_use_si: SI
# decimal units of 1000 (kB, MB, GB). zoxide_support needs zoxide.
[[item]]
kind = "keys"

[item.value]
case_sensitive_sort = true
code_previewer = "bat"
default_open_file_preview = false
default_sort_type = 4
file_size_use_si = true
ignore_missing_fields = true
transparent_background = true
zoxide_support = true

# bootstrap owns the list of the sidebar, so its order holds.
[[item]]
kind = "block"
path = [ "sidebar_sections" ]
value = [ "pinned", "disks", "home" ]
