# Synced from bootstrap: macos/tools/mise/files/.config/mise/config.toml. Do not edit this file.
# The next sync replaces it, and a manual change is lost.
# The version this config was last tested with; older mise warns, not fails
min_version = { soft = "2026.10.8" }

[settings]
activate_aggressive = true
all_compile = false
env_shell_expand = true
gpg_verify = true
lockfile = false
minimum_release_age = "10h"
minimum_release_age_excludes = [ "fnox", "age" ]
not_found_auto_install = false
os = "macos"
paranoid = true
raw = true
self_update.auto = true
self_update.minimum_release_age = "0h"
skills.fetch = false
skills.prune = true
status.missing_tools = "always"
status.show_deps_stale = true
status.show_env = true
status.show_tools = true
task.disable_spec_from_run_scripts = true
task.output = "interleave"
task.run_auto_install = false
trusted_config_paths = [ "~/.config/mise" ]

[settings.github]
# credential_command = "fnox get GITHUB_API_TOKEN"
use_git_credentials = true

[bootstrap.brew]
adopt = true

[tasks."global:init"]
description = "Initialize mise tasks"
hide = true
run = "find $HOME/.config/mise/tasks/ -name '*' -type f -exec chmod 755 {} \\;"

[env]
# Mise
MISE_BREW_CASK_OPT_APPDIR = "$HOME/Applications"
