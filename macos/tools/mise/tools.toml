# The mise tool: the user-level mise config (~/.config/mise/config.toml and
# miserc.toml), the activation files of bash, zsh and fish, and ~/.zprofile,
# which puts ~/.local/bin (the folder of mise) on PATH. The activation files
# read `projects_dir` of the cli tool, so this tool depends on cli. The entry
# tasks are Python uv scripts, so this tool also depends on python and uv: then
# both are in the init stage, and the first setup of bootstrap mac migrate
# installs them before it asks for a new terminal. The [mise.*] tables (usage, ca-certificates
# and the system aliases) become ~/.config/mise/conf.d/mise/mise.toml.
# It also ships the entry of the Mac sync: the task `updateall:configs`, which
# runs `bootstrap mac sync`, the task `updateall` and the upgrade tasks, into
# `~/.config/mise/tasks/`, and the Claude skill mac-setup into
# .claude/skills/mac-setup/ of the backup clone.
category = "system"
depends = [ "cli", "python", "uv" ]
description = "mise: its user-level config, its activation in bash, zsh and fish, ~/.zprofile, the entry tasks of the Mac sync and the Claude skill mac-setup of the backup clone"
summary = "mise, its config, the sync tasks and mac-setup"

# The lines of the skill mac-setup. Another tool adds one line with
# [contributes.mise.skill.lines] <tool> = "<line>", and SKILL.md shows one
# bullet for each key, in key order.
[defaults.skill.lines]
# The VS Code extensions of the tool, when visual-studio-code is selected.
[contributes.visual-studio-code]
extensions = [ "hverlin.mise-vscode", "redhat.vscode-yaml", "tamasfe.even-better-toml" ]

# MISE tools
[mise.tools.usage]
version = "latest"

# The CA certificates that each Mac must have
[mise.bootstrap.packages]
"brew:ca-certificates" = "latest" # Common CA certificates

# The CLI of the sync. updateall:configs runs it. Its release tags are
# bootstrap@X.Y.Z, and mise shows bootstrap@2.0.2 as 2.0.2.
[mise.tools."github:virajp/bootstrap"]
version = "latest"

[mise.shell_alias]
osx-upgrade = "mise run upgrade:macos:upgrade"
updateall = "mise run updateall"

# Startup, Services and Process related shortcuts
cancelPrintJobs = "sudo cancel -a -x"
listServices = "launchctl list | grep -v '^-' | sort -n | grep -v 'com.apple'"

# The files of the tool, below files/.
[files.".config/bash/01b-mise.bash"]
mode = "template"
source = ".config/bash/01b-mise.bash.tmpl"

[files.".config/fish/conf.d/06-mise.fish"]
mode = "template"
source = ".config/fish/conf.d/06-mise.fish.tmpl"

[files.".config/mise/config.toml"]
source = ".config/mise/config.toml"

[files.".config/mise/miserc.toml"]
source = ".config/mise/miserc.toml"

[files.".config/zsh/01b-mise.zsh"]
mode = "template"
source = ".config/zsh/01b-mise.zsh.tmpl"

[files.".zprofile"]
source = ".zprofile"

# The Claude skill mac-setup in the backup clone, when the claude tool is
# selected and its value skills is true. local.md is a seed: the own rules of
# the user.
[files.".claude/skills/mac-setup/SKILL.md"]
mode = "template"
root = "backup"
source = ".claude/skills/mac-setup/SKILL.md.tmpl"
when = "claude.skills"

[files.".claude/skills/mac-setup/references/conventions.md"]
root = "backup"
source = ".claude/skills/mac-setup/references/conventions.md"
when = "claude.skills"

[files.".claude/skills/mac-setup/references/local.md"]
mode = "seed"
root = "backup"
source = ".claude/skills/mac-setup/references/local.md"
when = "claude.skills"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."_scripts/helpers.py"]
library = true
source = "helpers.py"

[tasks."updateall/_default.py"]
source = "updateall.py"

[tasks."updateall/configs/_default.py"]
source = "updateall-configs.py"

[tasks."upgrade/macos/download.py"]
source = "upgrade-macos-download.py"

[tasks."upgrade/macos/upgrade.py"]
source = "upgrade-macos-upgrade.py"

[tasks."upgrade/power.py"]
source = "upgrade-power.py"
