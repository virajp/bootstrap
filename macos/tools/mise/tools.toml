# The mise tool: the user-level mise config (~/.config/mise/config.toml and
# miserc.toml), the activation files of bash, zsh and fish, and ~/.zprofile,
# which puts ~/.local/bin (the folder of mise) on PATH. The activation files
# read `projects_dir` of the cli tool, so this tool depends on cli. The [mise.*]
# tables (ruby, usage and the system aliases) become
# ~/.config/mise/conf.d/mise/mise.toml.
# It also ships the entry of the Mac sync: the task `updateall:configs`, which
# runs `bootstrap mac sync`, the task `updateall` and the upgrade tasks, into
# `~/.config/mise/tasks/`.
depends = [ "cli" ]
description = "mise: its user-level config, its activation in bash, zsh and fish, ~/.zprofile, and the entry tasks of the Mac sync"

[questions.config_path]
example = "~/Projects/github.com/janedoe/macos-setup"
question = "Which folder holds your macos.toml (the root of your private macos-setup clone)?"

[mise.env]
MACOS_SETUP_REPO_PATH = "<% index .config `config_path` | required `mise: set config_path in [tools.mise] of macos.toml` | regexp.Replace `^~` .env.HOME %>"

# Required by mise to parse the brew-cask correctly
[mise.tools.ruby]
version = "latest"

# MISE tools
[mise.tools.usage]
version = "latest"

# The CLI of the sync. updateall:configs runs it. Its release tags are
# bootstrap@X.Y.Z, and mise shows bootstrap@2.0.2 as 2.0.2.
[mise.tools."github:virajp/bootstrap"]
version = "latest"

[mise.shell_alias]
osx-upgrade = "mise run upgrade:macos:upgrade"
updateall = "mise run updateall"

# Startup, Services and Process related shortcuts
cancelPrintJobs = "sudo cancel -a -x"
listServices = "launchctl list | grep -v '^-' | sort -n | grep -v 'com.apple'"

# The files of the tool, below files/.
[files.".config/bash/01b-mise.bash"]
mode = "template"
source = ".config/bash/01b-mise.bash.tmpl"

[files.".config/fish/conf.d/06-mise.fish"]
mode = "template"
source = ".config/fish/conf.d/06-mise.fish.tmpl"

[files.".config/mise/config.toml"]
source = ".config/mise/config.toml"

[files.".config/mise/miserc.toml"]
source = ".config/mise/miserc.toml"

[files.".config/zsh/01b-mise.zsh"]
mode = "template"
source = ".config/zsh/01b-mise.zsh.tmpl"

[files.".zprofile"]
source = ".zprofile"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."_scripts/helpers"]
library = true
source = "helpers"

[tasks."updateall/_default"]
source = "updateall"

[tasks."updateall/configs/_default"]
source = "updateall-configs"

[tasks."upgrade/macos/download"]
source = "upgrade-macos-download"

[tasks."upgrade/macos/upgrade"]
source = "upgrade-macos-upgrade"

[tasks."upgrade/power"]
source = "upgrade-power"
