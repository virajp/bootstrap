# The tailscale tool.

category = "system"
description = "Tailscale (the formula; tailscaled runs as a root brew service) and its daemon and upgrade tasks"
summary = "Tailscale, the private network"

[mise.bootstrap.packages]
"brew:tailscale" = "latest" # tailscaled runs as a root brew service (tailscale:daemon task)

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."tailscale/daemon"]
source = "tailscale-daemon"

[tasks."upgrade/tailscale"]
source = "upgrade-tailscale"
