# The dprint tool.

description = "dprint, the code formatter, and its global config"

# JSON with comments and trailing commas: no JSON parser reads it.
[mise.tools.dprint]
version = "latest"

# The files of the tool, below files/.
[files.".config/dprint/dprint.jsonc"]
format = "text"
source = ".config/dprint/dprint.jsonc"
