# The node tool: the aube user config and the task upgrade:npm. The [mise.*]
# tables (node LTS through mise, its settings and environment) become
# ~/.config/mise/conf.d/node/mise.toml. A repository selects its own package
# manager, so this tool has no pnpm and no pnpm settings.
description = "Node.js (LTS), and the user config of the aube that mise embeds"

[mise.settings]
# NodeJS settings
node.compile = false
npm.package_manager = "aube"

[mise.tools.node]
version = "lts"

[mise.env]
NODE_ENV = "development"
_.path = { path = "node_modules/.bin", tools = true }
