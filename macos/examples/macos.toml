# Example: the values file of the Mac side.
# This file is at the root of the private macos-setup clone.
# MACOS_SETUP_CONFIG_PATH names the folder of that clone.
# Each [tools.<name>] table selects a tool and gives its values.
# Each [packs.<name>] table adds the default = true members of the pack.

# The bootstrap commit of the last sync. The sync writes it.
bootstrap_commit = ""

[tools.1password]
# The answer to the question ssh_vault of 1password.
ssh_vault = "Sample"

[tools.1password-cli]

[tools.1password-safari]

[tools.bitwarden]

[tools.claude-cli]

[tools.claude-desktop]

[tools.claude-status]

[tools.codeburn]

[tools.dasel]

[tools.devtools]

[tools.diff-so-fancy]
# This table selects the tool, because it is not a base tool.

[tools.dprint]

[tools.gem]

[tools.gh]
# The answer to the question editor of gh.
editor = "vim"

[tools.ghostty]

[tools.git]
# The answer to the question email_github of git.
email_github = "1234567+sampleuser@users.noreply.github.com"
# The answer to the question email_gitlab of git.
email_gitlab = "12345-sampleuser@users.noreply.gitlab.com"
# The answer to the question name of git.
name = "Sample User"
# The answer to the question signing_key of git.
signing_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAISampleKeyForTestsOnly sample@example.com"

[tools.git-tools]

[tools.glab]

[tools.macos-defaults]
# The answer to the question dock_orientation of macos-defaults.
dock_orientation = "right"

[tools.macos-setup]
# The answer to the question config_path of macos-setup.
config_path = "~/Projects/github.com/janedoe/macos-setup"

[tools.orbstack]

[tools.pstree]

[tools.ssh]
# The answer to the question user of ssh.
user = "sampleuser"

[tools.superfile]

[tools.tailscale]

[tools.telegram]
