# Example: the values file of the Mac side.
# This file is at the root of the private macos-setup clone.
# MACOS_SETUP_REPO_PATH names the folder of that clone.
# Each [tools.<name>] table selects a tool and gives its values.
# The file holds tools only: it has no [packs.<name>] table.

# The bootstrap commit of the last sync. The sync writes it.
bootstrap_commit = ""
format = 2

[tools.1password]
# The answer to the question ssh_vault of 1password.
ssh_vault = "Sample"

