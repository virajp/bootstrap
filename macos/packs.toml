# The packs of the Mac tools in macos/tools/. A pack has no files of its own; it
# is a shortcut of `bootstrap mac add pack`, and the values file keeps no record
# of it. Each key of its table is a member, `<tool> = {}`, and each member is a
# default; a nested pack is `"pack:<name>" = {}`. In `base` only,
# `required = true` marks a member that a Mac cannot remove. The key
# `description` is the text of the pack. See docs/design/packs.md.
[pack.base]
description = "The tools of each Mac: mise, Homebrew, the shells, git and its tools, ssh, the fonts, Python and the command-line tools, which a Mac cannot remove, and VS Code and uv."
mise = { required = true }
homebrew = { required = true }
bash = { required = true }
zsh = { required = true }
fish = { required = true }
git = { required = true }
git-tools = { required = true }
ssh = { required = true }
cli = { required = true }
fnox = { required = true }
node = { required = true }
touchid-sudo = { required = true }
starship = { required = true }
network = { required = true }
macos-defaults = { required = true }
gh = { required = true }
ruby = { required = true }
fonts = { required = true }
mas = { required = true }
age = { required = true }
bat = { required = true }
coreutils = { required = true }
curl = { required = true }
doggo = { required = true }
eza = { required = true }
fzf = { required = true }
gping = { required = true }
httping = { required = true }
ipcalc = { required = true }
jq = { required = true }
lazygit = { required = true }
prettyping = { required = true }
ripgrep = { required = true }
zoxide = { required = true }
diff-so-fancy = { required = true }
glab = { required = true }
btop = { required = true }
pstree = { required = true }
tree = { required = true }
watch = { required = true }
wget = { required = true }
yq = { required = true }
vorssaint = { required = true }
pre-commit = { required = true }
visual-studio-code = {}
python = { required = true }
uv = {}

