# The packs of the Mac tools in macos/tools/. A pack has no files of its own;
# each key of its table is a member: `<tool> = { default = true }` or
# `<tool> = {}`, and a nested pack is `"pack:<name>"`. The member order is the
# sync order, so keep it. The sync always adds the pack `base`, and `base` must
# hold `macos-setup`. The import plans add the other members.
[pack.base]
macos-setup = { default = true }
mise = { default = true }
homebrew = { default = true }
bash = { default = true }
zsh = { default = true }
fish = { default = true }
git = { default = true }
ssh = { default = true }
cli = { default = true }
fnox = { default = true }
node = { default = true }
touchid-sudo = { default = true }
starship = { default = true }
network = { default = true }
macos-defaults = { default = true }
gh = { default = true }
python = { default = true }
fonts = { default = true }
mas = { default = true }

[pack.ai]
claude-desktop = { default = true }
claude-cli = {}
claude-status = {}
codeburn = {}

[pack.essentials]
tailscale = {}
diff-so-fancy = {}
git-tools = {}
glab = {}

[pack.security]
1password = { default = true }
1password-cli = {}
1password-safari = {}
bitwarden = {}

[pack.dev]
devtools = { default = true }
dprint = { default = true }
orbstack = {}
gem = {}
superfile = {}

[pack.terminal]
ghostty = { default = true }

[pack.chat]
telegram = { default = true }

[pack.cli-extras]
dasel = { default = true }
pstree = { default = true }
