# The packs of the Mac tools in macos/tools/. A pack has no files of its own;
# each key of its table is a member: `<tool> = { default = true }` or
# `<tool> = {}`, and a nested pack is `"pack:<name>"`. The Mac sync sorts the
# tools by name in each stage, so the member order does not change the sync. The
# sync always adds the pack `base`. `required = true` marks a member of `base`
# that each Mac must have.
[pack.base]
mise = { default = true, required = true }
homebrew = { default = true }
bash = { default = true }
zsh = { default = true }
fish = { default = true }
git = { default = true }
ssh = { default = true }
cli = { default = true }
fnox = { default = true }
node = { default = true }
touchid-sudo = { default = true }
starship = { default = true }
network = { default = true }
macos-defaults = { default = true }
gh = { default = true }
python = { default = true }
fonts = { default = true }
mas = { default = true }

[pack.ai]
