# The core tool of the fixture repo, in pack base.

category = "dev"
summary = "The core tool of the fixture repo"

[defaults]
items = [ "a", "b" ]
name = "default-name"

[defaults.table]
left = "default-left"
right = "default-right"

[mise.env]
CORE_HOME = "{{ env.HOME }}"
CORE_NAME = "<% .config.name %>"

# The files of the tool, below files/.
[files.".config/core/plain.txt"]
source = ".config/core/plain.txt"

[files.".config/core/seeded.toml"]
mode = "seed"
render = true
requires = [ ".config/core-needed" ]
source = ".config/core/seeded.toml.tmpl"

[files.".config/core/settings.json"]
mode = "template"
source = ".config/core/settings.json.tmpl"

[files.".config/core/values.txt"]
mode = "template"
source = ".config/core/values.txt.tmpl"
