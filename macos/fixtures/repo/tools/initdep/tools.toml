# A tool with no stage of its own; it is in the init stage because the init
# tool depends on it.

category = "dev"
summary = "The dependency of the init tool"

[defaults]
items = [ "a", "b" ]

# The files of the tool, below files/.
[files.".config/initdep/dep.txt"]
source = ".config/initdep/dep.txt"

[files.".config/initdep/items.txt"]
mode = "template"
source = ".config/initdep/items.txt.tmpl"
