# A tool with a shared file of each format; only the merge config selects it.
description = "The shared files of the fixture repo"

category = "dev"
summary = "The shared files of the fixture repo"

[defaults]
items = [ "a" ]

# The files of the tool, below files/.
[files.".config/merger/m.json"]
mode = "merge"
source = ".config/merger/m.json.merge.toml"

[files.".config/merger/m.toml"]
mode = "merge"
source = ".config/merger/m.toml.merge.toml"

[files.".config/merger/m.txt"]
mode = "merge"
source = ".config/merger/m.txt.merge.toml"

[files.".config/merger/m.yaml"]
mode = "merge"
source = ".config/merger/m.yaml.merge.toml"

[files.".config/merger/plain.txt"]
source = ".config/merger/plain.txt"
