# The sshdir tool of the fixture repo: two targets below ~/.ssh, for the mode of
# that folder.

description = "two targets below the ssh folder"

# The files of the tool, below files/.
[files.".ssh/config"]
format = "text"
source = ".ssh/config"

[files.".ssh/config.identity"]
format = "text"
source = ".ssh/config.identity"
