# Example: the sibling ../acme-app of the base repository acme-product. It is
# a node polyrepo with the branch main only.

# The bootstrap commit of the last sync. repo-sync writes it.
bootstrap_commit = "0123456789abcdef0123456789abcdef01234567"
# The commit scopes of git-conventional-commits.
commit_scopes = [ "ui", "l10n" ]
# The mise environments: dev (necessary) and ci.
environments = [ "dev", "ci" ]
# The product name, for the fnox keychain service.
product_name = "acme"
repo_name = "acme-app"
# The web URL of the repository, for the github tool.
repo_url = "https://github.com/example/acme-app"
# The gitignored files to copy into a new worktree.
worktree_files = [ ".config/mise.local.toml" ]

[tools.claude]

[tools.github]

[tools.node]
env = [ "dev", "ci" ]

# A feature branch merges into main through a pull request.
[branch.main]
merge_model = "pr"
