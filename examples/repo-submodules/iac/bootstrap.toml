# Example: the submodule iac. It is a pulumi polyrepo with the branch develop
# only.

# The bootstrap commit of the last sync. repo-sync writes it.
bootstrap_commit = ""
# The commit scopes of git-conventional-commits.
commit_scopes = [ "network", "storage" ]
# The mise environments: dev (necessary) and ci.
environments = [ "dev", "ci" ]
# The VS Code extensions that no tool has.
extensions = [ "pulumi.pulumi-lsp-client" ]
# The product name, for the fnox keychain service.
product_name = "acme"
repo_name = "acme-iac"
# The web URL of the repository, for the github tool.
repo_url = "https://github.com/example/acme-iac"
# The gitignored files to copy into a new worktree.
worktree_files = [ ".config/mise.local.toml" ]

# pulumi is for dev only: its mise tool does not allow ci.
[tools.pulumi]
env = [ "dev" ]

# Pin pulumi instead of latest. The path after overrides is the path in
# tools/pulumi/tools.toml.
[overrides.mise.tools.pulumi]
version = "3"

# A feature branch merges into develop. main never merges into develop.
[branch.develop]
merge_model = "direct"
merge_never = [ "main" ]
