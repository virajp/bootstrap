# Example: a node monorepo with the branches main and develop.
# Feature branches merge into develop. Only develop merges into main.

# The commit scopes of git-conventional-commits. The default is the member
# list.
commit_scopes = [ "common", "deps", "service", "worker" ]
# The mise environments: dev (necessary) and ci.
environments = [ "dev", "ci" ]
# The VS Code extensions that no tool has.
extensions = [ "dbaeumer.vscode-eslint" ]
# The product name, for the fnox keychain service.
product_name = "shop"
repo_name = "shop-platform"
# The web URL of the repository, for the github tool.
repo_url = "https://github.com/example/shop-platform"
# The gitignored files to copy into a new worktree.
worktree_files = [ ".config/mise.local.toml", ".env" ]

[tools.claude]

[tools.node]
env = [ "dev", "ci" ]

# Override the defaults of the tools. The path after overrides is the path in
# tools/<tool>/tools.toml. Node 24 in dev, and Node 22 in CI.
[overrides.mise.tools.node]
version = "24"

[overrides.mise_env.ci.tools.node]
version = "22"

# Override a mise setting of the node tool.
[overrides.mise.settings]
node.compile = true

# Change the shared .gitignore. remove comments out a shared line, then add
# puts the repository's own lines at the end.
[overrides.gitignore]
add = [ "/coverage/", "!.env.example" ]
remove = [ "*.log" ]

# Change the shared .graphifyignore of the claude tool, with the same rules.
# graphify also reads .gitignore, so add only committed files that are not
# code.
[overrides.graphifyignore]
add = [ "fixtures/" ]

# The Claude Code plugins that setup:ai installs. The key is the plugin, and
# the value is the source of its marketplace. Each table can be empty.
[claude.plugins.user]
"taste-skill@taste-skill" = "Leonxlnx/taste-skill"

[claude.plugins.project]
# A feature branch merges into develop. main never merges into develop.
[branch.develop]
merge_model = "direct"
merge_never = [ "main" ]

# Only develop merges into main, through a pull request.
[branch.main]
merge_from = [ "develop" ]
merge_model = "pr"

# The folder members. A folder member is part of the root tree.
[member.common]
folder = "packages/common"
label = "Common"
type = "folder"

[member.service]
folder = "projects/service"
label = "Service"
type = "folder"

[member.worker]
folder = "projects/worker"
label = "Worker"
type = "folder"
