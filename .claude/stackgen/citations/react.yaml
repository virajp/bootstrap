catalog:
  index: vwf/assets/principles/index.md
  entries_instantiated:
    - kiss                      # one component model for static markup; one island before a store; no memoization machinery without a measurement
    - yagni                     # zero islands by default; no shared store in advance
    - single-responsibility     # when to split a component inside an island; the parameter module
    - information-hiding        # the shared query parameter as deliberately published knowledge
    - interface-segregation     # narrowest typed props
    - design-by-contract        # props as a typed interface at the boundary; the query parameter validated at a trust boundary
    - explicit-error-semantics  # boundaries, handler-owned failures, reader-facing fallbacks, the console as the causal chain's destination
  when_not_to_apply_honored:
    - kiss: "familiar is not simple — static markup inside an island's tree is React because that is the island's idiom; a performance measure may justify memoization or the compiler, with the measurement beside it"
    - yagni: "safety guardrails stay — the pre-hydration frame and accessible ids are not deferred"
    - interface-segregation: "cohesive record props are not shattered into scalars"
    - explicit-error-semantics: "outermost edge speaks the reader's vocabulary while the causal chain goes to the browser console, since no telemetry sink is declared (React's default root logging for render failures, the handler's own console.error for handler failures); the best-effort exception is NOT invoked"
    - information-hiding: "some information is the contract — a shared query parameter is published, so it is declared explicitly in one src/lib module and versioned additively, not hidden behind a wrapper; the islands still hide everything else from each other"
    - design-by-contract: "at trust boundaries caller's fault never means skip the check — the query parameter is validated on every read, with defined behaviour for absent, unknown and malformed values; island props are typed rather than re-validated, since the build is inside the trust domain"
    - single-responsibility: "don't split below the concept — the parameter module keeps parse and serialize together as one decision (the parameter's shape); and a modest island component is acceptable scaffolding — start with one, split when a second concern starts changing, not the day it appears (framework-doctrine.md, Composition inside an island)"
  entries_not_used:
    - dry: its one use was the styling rule, removed in round 4 — styling is the stylesheet component's
    - open-closed: no extension surface in an island component
    - liskov-substitution: no substitutable hierarchies in island code
    - dependency-inversion: no vendor dependency inside islands to invert; reporting is named by role
    - idempotency: no writes or retries on a static site
    - least-privilege: no credentials or grants reach an island

