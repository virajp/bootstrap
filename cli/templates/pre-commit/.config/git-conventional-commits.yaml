---
convention:
  commitTypes:
    - ops
    - docs
    - merge
    - feat
    - fix
    - refactor
  commitScopes: [<% for scope in commit_scopes %> <%= scope | json %><% unless forloop.last %>,<% endunless %><% endfor %><% unless commit_scopes == empty %> <% endunless %>]

changelog:
  commitTypes:
    - feat
    - fix
    - refactor
  includeInvalidCommits: false
  commitIgnoreRegexPattern: '^[wW][iI][pP]\b'
  headlines:
    feat: Features
    fix: Bug Fixes
    perf: Performance Improvements
    merge: Merges
    breakingChange: BREAKING CHANGES

  # The forge's links: GitLab's when the gitlab tool is selected, GitHub's
  # otherwise.
  commitUrl: "<% if tools contains 'gitlab' %>https://gitlab.com/<%= repo %>/-/commit/%commit%<% else %>https://github.com/<%= repo %>/commit/%commit%<% endif %>"
  commitRangeUrl: "<% if tools contains 'gitlab' %>https://gitlab.com/<%= repo %>/-/compare/%from%...%to%<% else %>https://github.com/<%= repo %>/compare/%from%...%to%?diff=split<% endif %>"

  # The forge's issues
  issueRegexPattern: "#[0-9]+"
  issueUrl: "<% if tools contains 'gitlab' %>https://gitlab.com/<%= repo %>/-/issues/%issue%<% else %>https://github.com/<%= repo %>/issues/%issue%<% endif %>"
