---
convention:
  commitTypes:
    - ops
    - docs
    - merge
    - feat
    - fix
    - refactor
  commitScopes: <%= commit_scopes | json %>

changelog:
  commitTypes:
    - feat
    - fix
    - refactor
  includeInvalidCommits: false
  commitIgnoreRegexPattern: '^[wW][iI][pP]\b'
  headlines:
    feat: Features
    fix: Bug Fixes
    perf: Performance Improvements
    merge: Merges
    breakingChange: BREAKING CHANGES

  # GitHub
  commitUrl: https://github.com/<%= repo %>/commit/%commit%
  commitRangeUrl: https://github.com/<%= repo %>/compare/%from%...%to%?diff=split

  # GitHub Issues
  issueRegexPattern: "#[0-9]+"
  issueUrl: https://github.com/<%= repo %>/issues/%issue%
