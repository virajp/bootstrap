[settings]
# Python, pipx, uv settings
# every pipx: tool installs through uv
pipx.uvx            = true
python.compile      = false
python.uv_venv_auto = "create|source"

[tools.node]
version = "latest"

[tools.pnpm]
depends = [ "node" ]
version = "latest"

[tools.python]
version = "latest"

[tools.uv]
depends = [ "python" ]
version = "latest"

[tools.jq]
version = "latest"

# The entries of the selected base tools. Each `if` opens inside the string of
# the entry before it and closes inside the string of its own last line, so an
# unselected tool's entry renders as nothing and this template stays valid TOML.
[tools.yq]
version = "latest<% if selection contains 'pre-commit' %>"

[tools."pre-commit"]
depends = [ "python", "uv" ]
uvx     = true
version = "latest<% endif %><% if selection contains 'dprint' %>"

# Dprint is a code formatter for various programming languages
[tools.dprint]
version = "latest<% endif %><% if selection contains 'taplo' %>"

# Taplo is a code formatter for TOML files
[tools.taplo]
depends = [ "dprint" ]
version = "latest<% endif %><% if selection contains 'virajp-linter' %>"

# The house linter (`linter`), which `code:lint` runs
[tools."npm:@askviraj/linter"]
depends = [ "node" ]
version = "latest<% endif %><% if selection contains 'dprint' %>"

# The package.json key sorter (`sort-package-json`), which `code:format` runs
[tools."npm:sort-package-json"]
depends = [ "node" ]
version = "latest<% endif %>"

[tasks.init]
description = "Initialize mise tasks"
dir         = "{{exec(command='git rev-parse --show-toplevel')}}"
hide        = true
run         = "find .config/mise/tasks/ -name '*' -type f -exec chmod 755 {} \\;"

[shell_alias]
precommit = "mise run code:precommit"
setup     = "mise run setup:all"
worktrees = "mise run code:worktrees"

[env]
# Python (uv)
UV_NO_CACHE          = true
UV_NO_MANAGED_PYTHON = true
UV_PYTHON_DOWNLOADS  = "never"
