# The Google Cloud CLI, for a repository that deploys to Google Cloud.
depends = []
extensions = []
root_only = false
seed = []

# The mise config, generated into .config/mise/conf.d/gcloud/mise.<env>.toml.
[mise.tools.gcloud]
depends = [ "python", "uv" ]
envs = [ "dev", "ci" ]
version = "latest"

[mise.env]
# gcloud's installer needs Python 3.10 or later. Without this it uses the
# system python3 (3.9 on macOS) and fails.
CLOUDSDK_PYTHON = "{{ xdg_data_home }}/mise/installs/python/latest/bin/python"
