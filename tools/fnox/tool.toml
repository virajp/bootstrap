# Secrets from .config/fnox.toml, checked by setup:secrets:fnox.
depends = []
extensions = []
root_only = false
seed = [ ".config/fnox.toml.tmpl" ]

# The mise config, generated into .config/mise/conf.d/fnox/mise.<env>.toml.
# Fnox resolves the repo's secrets from the providers in .config/fnox.toml.
# Only dev: ci, prod and stage have their own secret management.
[mise.tools.fnox]
version = "latest"

[mise.env]
# fnox always loads the global config of FNOX_CONFIG_DIR. This folder of the
# repository has no config.toml, so no global secrets load here. config_root is
# the folder of the generated file, .config/mise/conf.d/fnox/.
FNOX_CONFIG_DIR = "{{ config_root }}/../../../../.config/fnox"
