# Python and uv.
default_envs = [ "dev", "ci" ]
depends = []
extensions = []
root_only = false
seed = []

# The mise config, generated into .config/mise/conf.d/python/mise.<env>.toml.
[mise.settings]
pipx.uvx = true
python.compile = false
python.uv_venv_auto = "create|source"

# CLOUDSDK_PYTHON of the gcloud tool uses the same minor version. Change both.
[mise.tools.python]
envs = [ "dev", "ci" ]
version = "3.14"

[mise.tools.uv]
depends = [ "python" ]
envs = [ "dev", "ci" ]
version = "latest"

[mise.env]
UV_NO_CACHE = true
UV_NO_MANAGED_PYTHON = true
UV_PYTHON_DOWNLOADS = "never"
