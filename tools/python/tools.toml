# Python and uv. In a repository with a pyproject.toml, also ruff and pyrefly,
# with their code:lint and code:format tasks.
default_envs = [ "dev", "ci" ]
depends = []
extensions = [ "meta.pyrefly" ]
root_only = false

[files.".config/mise/tasks/code/format/ruff"]
requires_found = [ "pyproject.toml" ]

[files.".config/mise/tasks/code/lint/ruff"]
requires_found = [ "pyproject.toml" ]

[files.".config/mise/tasks/code/lint/pyrefly"]
requires_found = [ "pyproject.toml" ]

# The mise config, generated into .config/mise/conf.d/python/mise.<env>.toml.
[mise.settings]
pipx.uvx = true
python.compile = false
python.uv_venv_auto = "create|source"

# CLOUDSDK_PYTHON of the gcloud tool uses the same minor version. Change both.
[mise.tools.python]
envs = [ "dev", "ci" ]
version = "3.14"

[mise.tools.uv]
depends = [ "python" ]
envs = [ "dev", "ci" ]
version = "latest"

# The gates of a Python project. Many repositories have python only for the
# tools of other bootstrap tools, so the sync installs these two, and writes
# their tasks, only when requires_found finds a pyproject.toml.
[mise.tools.ruff]
envs = [ "dev", "ci" ]
requires_found = [ "pyproject.toml" ]
version = "latest"

[mise.tools."pipx:pyrefly"]
depends = [ "python", "uv" ]
envs = [ "dev", "ci" ]
requires_found = [ "pyproject.toml" ]
version = "latest"

[mise.env]
UV_NO_CACHE = true
UV_NO_MANAGED_PYTHON = true
UV_PYTHON_DOWNLOADS = "never"
