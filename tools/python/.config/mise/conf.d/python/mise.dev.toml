# Synced from repo-config: tools/python/.config/mise/conf.d/python/mise.dev.toml. Do not edit this file.
# The next sync replaces it, and a manual change is lost.

[settings]
# Python settings
pipx.uvx = true
python.compile = false
python.uv_venv_auto = "create|source"

[tools.python]
version = "3.14"

[tools.uv]
depends = [ "python" ]
version = "latest"

[env]
# Python (uv)
UV_NO_CACHE = true
UV_NO_MANAGED_PYTHON = true
UV_PYTHON_DOWNLOADS = "never"
