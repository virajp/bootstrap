# Node and pnpm.
depends = []
extensions = [ "christian-kohler.npm-intellisense" ]
root_only = false
seed = [ "pnpm-workspace.yaml" ]

# A repository that uses node only as a dev tool has no package.json, and it
# does not get the pnpm settings.
[seed_requires]
"pnpm-workspace.yaml" = "package.json"

# The mise config, generated into .config/mise/conf.d/node/.
[mise.settings]
node.compile = false
npm.package_manager = "pnpm"

[mise.tools.node]
version = "lts"

[mise.tools.pnpm]
depends = [ "node" ]
version = "latest"

[mise.env]
_.path = { path = "node_modules/.bin", tools = true }

[mise.shell_alias]
npx = "pnpm dlx"
