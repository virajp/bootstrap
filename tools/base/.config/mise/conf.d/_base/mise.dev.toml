# Synced from repo-config: tools/base/.config/mise/conf.d/_base/mise.dev.toml. Do not edit this file.
# The next sync replaces it, and a manual change is lost.

# Formatter
[tools.dprint]
version = "latest"

# Linter
[tools."npm:@askviraj/linter"]
version = "latest"

# Shell linter
[tools.shellcheck]
version = "latest"

# Template renderer for `setup:configs`. Declared here too, because `mise prune`
# keeps only the tools that a config file names, not a task header.
[tools.gomplate]
version = "latest"

# JSON and YAML queries
[tools.jq]
version = "latest"

[tools.yq]
version = "latest"

[shell_alias]
setup = "mise run setup"
