# Synced from repo-config: tools/base/.config/mise/conf.d/_base/mise.ci.toml. Do not edit this file.
# The next sync replaces it, and a manual change is lost.

# `os = "macos"` in .config/mise.toml selects macOS binaries. CI runs on
# Linux, so this file selects Linux binaries when MISE_ENV includes `ci`.
[settings]
os = "linux"
