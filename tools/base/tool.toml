# The files every repository gets: mise, the task library, formatter, linters, scanners and pre-commit.
depends = []
extensions = [
  "dbaeumer.vscode-eslint",
  "dprint.dprint",
  "gruntfuggly.todo-tree",
  "hverlin.mise-vscode",
  "oderwat.indent-rainbow",
  "pkief.material-icon-theme",
  "redhat.vscode-yaml",
  "tombi-toml.tombi",
  "usernamehw.errorlens",
]
root_only = false
seed = [ ".config/gitleaks.toml.tmpl", ".config/grype.yaml", ".config/osv-scanner.toml" ]

# The gate hooks are tool-neutral: each names a task and nothing else. Which
# formatter, linters and scanners run is decided inside the task, so a hook and
# CI cannot drift apart. `code:format` comes first because it rewrites files;
# `code:sec` comes last because it is the only one that cannot fix what it finds.
[[precommit]]
repo = "local"

[[precommit.hooks]]
always_run = true
description = "Prevents a local .git/config from overriding global user and signing settings."
entry = "mise x -- mise run code:git-config --fix"
id = "git-config"
language = "system"
name = "Forbidden local git-config"
pass_filenames = false

[[precommit.hooks]]
description = "The repo's formatters, run over the files being committed."
entry = "mise x -- mise run code:format --fix"
id = "format"
language = "system"
name = "Format (mise run code:format)"
pass_filenames = true

[[precommit.hooks]]
description = "The repo's linters, run over the files being committed."
entry = "mise x -- mise run code:lint --fix"
id = "lint"
language = "system"
name = "Lint (mise run code:lint)"
pass_filenames = true

[[precommit.hooks]]
always_run = true
description = "The secret scan, over what is staged rather than over the tree."
entry = "mise x -- mise run code:sec --staged"
id = "sec"
language = "system"
name = "Secrets (mise run code:sec --staged)"
pass_filenames = false

[[precommit.hooks]]
always_run = true
description = "Refreshes the graphify graph after each commit, instead of the raw git hook of graphify."
entry = "mise x -- mise run code:graph"
id = "graphify-refresh"
language = "system"
name = "Refresh the graphify graph (mise run code:graph)"
pass_filenames = false
stages = [ "post-commit" ]

[[precommit]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[precommit.hooks]]
args = [ "--maxkb=1024" ]
id = "check-added-large-files"
name = "Check for added large files (>1MB)"

[[precommit.hooks]]
id = "check-case-conflict"
name = "Check for case-conflicting filenames"

[[precommit.hooks]]
id = "check-illegal-windows-names"
name = "Check for filenames Windows cannot check out"

[[precommit.hooks]]
id = "check-executables-have-shebangs"
name = "Check that executables have shebangs"

[[precommit.hooks]]
id = "check-shebang-scripts-are-executable"
name = "Check that scripts with shebangs are executable"

[[precommit.hooks]]
id = "check-merge-conflict"
name = "Check for merge conflict markers"

[[precommit.hooks]]
id = "check-symlinks"
name = "Check for broken symlinks"

[[precommit.hooks]]
id = "destroyed-symlinks"
name = "Check for destroyed symlinks"

[[precommit.hooks]]
# tsconfig and the VS Code files are JSONC: comments and trailing commas.
exclude = '(^|/)tsconfig[^/]*\.json$|(^|/)\.vscode/'
id = "check-json"
name = "Check JSON syntax"

[[precommit.hooks]]
id = "check-toml"
name = "Check TOML syntax"

[[precommit.hooks]]
args = [ "--allow-multiple-documents" ]
id = "check-yaml"
name = "Check YAML syntax"

[[precommit.hooks]]
id = "detect-private-key"
name = "Check for committed private keys"

[[precommit.hooks]]
id = "end-of-file-fixer"
name = "Ensure files end with a newline"

[[precommit.hooks]]
id = "trailing-whitespace"
name = "Remove trailing whitespace"

[[precommit.hooks]]
args = [ "--fix=lf" ]
id = "mixed-line-ending"
name = "Normalise line endings to LF"

[[precommit.hooks]]
args = [ "--branch", "main", "--branch", "develop" ]
description = "These branches take merges only. git runs pre-merge-commit for a merge, so merges are not affected."
id = "no-commit-to-branch"
name = "Refuse a direct commit to main or develop"

[[precommit]]
repo = "https://github.com/qoomon/git-conventional-commits"
rev = "v2.9.0"

[[precommit.hooks]]
args = [ "--config", ".config/git-conventional-commits.yaml" ]
id = "conventional-commits"
name = "Conventional Commits"
stages = [ "commit-msg" ]

# The mise config, generated into .config/mise/conf.d/_base/. A tool with
# `env = "dev"` is only for development.

# Security scanners. In every environment, because CI runs `code:sec` too.
[mise.tools.gitleaks]
version = "latest"

[mise.tools.grype]
version = "latest"

[mise.tools.osv-scanner]
version = "latest"

# Formatter
[mise.tools.dprint]
env = "dev"
version = "latest"

# Linter
[mise.tools."npm:@askviraj/linter"]
depends = [ "node", "pnpm" ]
env = "dev"
version = "latest"

# Shell linter
[mise.tools.shellcheck]
env = "dev"
version = "latest"

# Template renderer for `setup:configs`. Declared here too, because `mise prune`
# keeps only the tools that a config file names, not a task header.
[mise.tools.gomplate]
env = "dev"
version = "latest"

# JSON and YAML queries
[mise.tools.jq]
env = "dev"
version = "latest"

[mise.tools.yq]
env = "dev"
version = "latest"

[mise.tools.pre-commit]
depends = [ "python", "uv" ]
env = "dev"
version = "latest"

[mise.env]
PRE_COMMIT_HOME = "$HOME/.cache/pre-commit"

[mise.shell_alias]
precommit = "mise run code:precommit"

[mise.tasks.init]
description = "Initialize mise tasks"
dir = "{{exec(command='git rev-parse --show-toplevel')}}"
hide = true
run = "find .config/mise/tasks/ -name '*' -type f -exec chmod 755 {} \\;"
