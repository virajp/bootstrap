# GitLab: the glab CLI, and the issue and merge request templates.
default_envs = [ "dev", "ci" ]
depends = []
extensions = [ "gitlab.gitlab-workflow" ]
root_only = false
seed = []

# `glab ci lint` asks the GitLab API, so it needs the network and `glab auth`.
[[precommit]]
repo = "local"

[[precommit.hooks]]
entry = "mise x -- glab ci lint"
files = '^\.gitlab-ci\.yml$'
id = "glab-ci-lint"
language = "system"
name = "Lint the GitLab CI config (glab ci lint)"
pass_filenames = false

# The mise config, generated into .config/mise/conf.d/gitlab/mise.<env>.toml.

# GitLab CLI: issues, merge requests, `glab ci lint`, and `code:merge` under
# the `pr` model
[mise.tools.glab]
envs = [ "dev", "ci" ]
version = "latest"
