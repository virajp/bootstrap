# Data model for Tool. Governing status lives in index.md frontmatter.
$schema: https://json-schema.org/draft/2020-12/schema
title: Tool
description: A named set of setup files for one tool, shipped inside bootstrap;
  a read-only catalog entry.
type: object
properties:
  name:
    type: string
    description: Unique tool name, typed by users in `--tool <name>`, `bootstrap
      add <name>` and `bootstrap remove <name>`.
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  categories:
    type: array
    description: "Names of the Tool categories this tool belongs to (target entity Tool category), at least one. Each must name an existing category; the limit of every `max: one` category applies to the tool."
    minItems: 1
    uniqueItems: true
    items:
      type: string
      description: A Tool category name.
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  purpose:
    type: string
    description: One-line description, shown after the tool's name in the tui
      and
      in the docs (for a shown tool). The 1.0 values are in the Catalog table of
      index.md.
    minLength: 1
  removable:
    type: boolean
    description: True when the tool may be removed from a repository; false
      means it is always selected.
  hidden:
    type: boolean
    description: True when the tool is always applied and never shown, recorded
      or accepted by name (index.md invariant 7). True only for `mise`.
    default: false
  default:
    type: string
    description: Whether the tool is in the first-run default selection (init
      with no `--tool`, and the tui first-run view). `on` selects it,
      `off` does not, `origin` selects it when the host of the git remote
      `origin` equals one of `origin_hosts`, compared ignoring case.
    enum: [ "on", "off", "origin" ]
  engine:
    type: string
    description: The engine this runtime is of; set only on a `runtime` tool,
      absent on every other tool and on a runtime of no engine. Engines are not
      catalog tools; the Engines table of index.md lists each engine's runtimes
      and default runtime.
    enum: [ javascript, java, dart, python, swift, ruby ]
  requires:
    type: array
    description: The requirements of this tool; may be empty. Each names one
      tool, met while that tool is selected, or one engine, met while at least
      one runtime of that engine is selected (when none is, the engine's
      default runtime is added as a dependency). Every named tool is a tool of
      the catalog.
    uniqueItems: true
    items:
      type: object
      description: One requirement, naming exactly one tool or one engine.
      properties:
        tool:
          type: string
          description: A tool name.
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        engine:
          type: string
          description: An engine name.
          enum: [ javascript, java, dart, python, swift, ruby ]
      oneOf:
        - required: [ tool ]
        - required: [ engine ]
      additionalProperties: false
  pin:
    description: The tool's mise pin, or null when the tool has no pin (the
      no-pin list in index.md Target paths). A pinned tool renders its exact
      pin in `conf.d/<tool>/mise.toml` and `latest` in
      `conf.d/<tool>/mise.dev.toml`; these two paths are implied by `pin` and
      are not listed in `files`.
    oneOf:
      - type: "null"
      - type: object
        properties:
          id:
            type: string
            description: The mise tool key, for example
              `npm:@virajp.dev/linter`,
              `gem:cocoapods`, `npm:cf` or `java`.
            minLength: 1
          variant:
            type: string
            description: The version prefix of a vendor line, for example
              `temurin-`; absent when the tool has none.
            minLength: 1
          dev_file:
            type: boolean
            description: False when the tool has no `mise.dev.toml` and is
              exact in every environment (only `osv-scanner`).
            default: true
        required: [ id ]
        additionalProperties: false
  takes_over:
    type: array
    description: The runtimes whose built-in manager task files
      (`tasks/setup/deps/<verb>/<runtime>`, `tasks/upgrade/deps/<runtime>`) are
      not rendered while this tool is selected. Set only on a
      `package-manager` tool; `pnpm` and `yarn` take over `node`, `uv` takes
      over `python`; empty for the others.
    uniqueItems: true
    default: []
    items:
      type: string
      description: A runtime tool name.
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  host_only:
    type: boolean
    description: True when mise cannot install the tool (for example the Apple
      developer tools). It has no pin and no mise entry,
      and every task that needs it first checks that it is present.
    default: false
  host_os:
    type: string
    description: The only operating system the tool runs on. Absent when the
      tool runs anywhere. A new selection on another host is refused; a recorded
      one stays selected and its tasks fail there (index.md Host-only tools).
    enum: [ macos ]
  vscode_extensions:
    type: array
    description: Editor extension ids this tool contributes to
      `.vscode/extensions.json`; the file lists the union over the selected
      tools. May be empty.
    uniqueItems: true
    default: []
    items:
      type: string
      description: A marketplace extension id, `publisher.name`.
      pattern: "^[A-Za-z0-9][A-Za-z0-9-]*\\.[A-Za-z0-9][A-Za-z0-9-]*$"
  renamed_from:
    type: array
    description: Earlier catalog names of this tool. A recorded old name is read
      as this tool and rewritten as a repair with the warning "renamed tool
      `<old>` to `<new>`". An old name is never a current tool name and belongs
      to one tool only.
    uniqueItems: true
    default: []
    items:
      type: string
      description: An old tool name.
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  origin_hosts:
    type: array
    description: "Hosts of the git remote `origin` that select this tool by default. Required when `default` is `origin`, and present only then. No two `origin` tools of one `max: one` category share a host."
    minItems: 1
    uniqueItems: true
    items:
      type: string
      description: A host name, for example the forge's public host.
      minLength: 1
  files:
    type: array
    description: Target-repository files this tool renders. A path belongs to
      exactly one tool. May be empty (a tool that contributes only an editor
      extension). The Target paths table in index.md is the authority for the
      1.0 path set; contents are part of the contract only where index.md
      Target paths says so.
    uniqueItems: true
    items:
      type: object
      description: One file the tool renders.
      properties:
        path:
          type: string
          description: Repository-relative path of the file.
          minLength: 1
        create_only:
          type: boolean
          description: True when the file is written only when absent, never
            changed or deleted, and reported `kept` (per conventions.md#safety).
            True for every file an owner may edit by hand. Default false, a
            universal file that every run renders again.
          default: false
      required: [ path ]
      additionalProperties: false
required: [
  name,
  categories,
  purpose,
  removable,
  default,
  requires,
  pin,
  files,
]
allOf:
  - if:
      properties:
        hidden:
          const: true
      required: [ hidden ]
    then:
      properties:
        name:
          const: mise
  - if:
      properties:
        removable:
          const: false
      required: [ removable ]
    then:
      properties:
        default:
          const: "on"
  - if:
      not:
        properties:
          categories:
            contains:
              const: runtime
    then:
      not:
        required: [ engine ]
  - if:
      not:
        properties:
          categories:
            contains:
              const: package-manager
    then:
      properties:
        takes_over:
          maxItems: 0
  - if:
      properties:
        default:
          const: origin
      required: [ default ]
    else:
      not:
        required: [ origin_hosts ]
  - if:
      properties:
        default:
          const: origin
      required: [ default ]
    then:
      required: [ origin_hosts ]
additionalProperties: false
$defs:
  engine:
    type: object
    description: One row of the Engines table in index.md. An engine is not a
      catalog tool; it exists as the `engine` field of its runtimes and as a
      requirement of other tools.
    properties:
      name:
        type: string
        enum: [ javascript, java, dart, python, swift, ruby ]
      runtimes:
        type: array
        description: The runtime tools whose `engine` is this engine.
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      default:
        type: string
        description: The runtime added when a tool requires this engine and
          none of its runtimes is selected; one of `runtimes`.
      max:
        type: string
        description: How many of its runtimes a repository can select at once.
        enum: [ one, many ]
    required: [ name, runtimes, default, max ]
    additionalProperties: false
