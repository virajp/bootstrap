# Data model for Tool. Governing status lives in index.md frontmatter.
$schema: https://json-schema.org/draft/2020-12/schema
title: Tool
description: A named set of setup files for one tool, shipped inside bootstrap; a read-only catalog entry.
type: object
properties:
  name:
    type: string
    description: Unique tool name, typed by users in `--tool <name>`, `bootstrap add <name>` and `bootstrap remove <name>`.
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  category:
    type: string
    description: Name of the Tool category this tool belongs to (target entity Tool category). Must name an existing category.
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  purpose:
    type: string
    description: One-line description, shown in the init picker, the tui and the docs. The 1.0 values are in the Catalog table of index.md.
    minLength: 1
  base:
    type: boolean
    description: True when the tool's mise entries render into `.config/mise/conf.d/_base/`; false when they live in `.config/mise/conf.d/<tool>/`. Matters only for a tool that has mise entries.
  removable:
    type: boolean
    description: True when the tool may be removed from a repository; false means it is always selected.
  replaceable:
    type: boolean
    description: "True when another tool of a `max: one` category may replace this one, with the actor's consent. It has no effect outside a `max: one` category."
  default:
    type: string
    description: Whether init selects the tool when the actor gives no `--tool`. `on` selects it, `off` does not, `origin` selects it when the host of the git remote `origin` matches one of `origin_hosts`.
    enum: ["on", "off", "origin"]
  requires:
    type: array
    description: Names of tools that must also be selected with this tool. May be empty. Every entry names a tool of the catalog.
    uniqueItems: true
    items:
      type: string
      description: A tool name.
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  origin_hosts:
    type: array
    description: "Hosts of the git remote `origin` that select this tool by default. Required when `default` is `origin`, and present only then. No two `origin` tools of one `max: one` category share a host."
    minItems: 1
    uniqueItems: true
    items:
      type: string
      description: A host name, for example the forge's public host.
      minLength: 1
  files:
    type: array
    description: Target-repository files this tool renders. A path belongs to exactly one tool. The Target paths table in index.md is the authority for the 1.0 path set; contents are not part of the contract.
    minItems: 1
    uniqueItems: true
    items:
      type: object
      description: One file the tool renders.
      properties:
        path:
          type: string
          description: Repository-relative path of the file.
          minLength: 1
        create_only:
          type: boolean
          description: True when the file is written only when absent, never changed or deleted, and reported `kept` (per conventions.md#safety). Default false.
          default: false
      required: [path]
      additionalProperties: false
required: [name, category, purpose, base, removable, replaceable, default, requires, files]
allOf:
  - if:
      properties:
        removable:
          const: false
      required: [removable]
    then:
      properties:
        replaceable:
          const: false
        default:
          const: "on"
  - if:
      properties:
        default:
          const: origin
      required: [default]
    else:
      not:
        required: [origin_hosts]
  - if:
      properties:
        default:
          const: origin
      required: [default]
    then:
      required: [origin_hosts]
additionalProperties: false
