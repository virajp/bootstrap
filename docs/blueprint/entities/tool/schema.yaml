# Data model for Tool. Governing status lives in index.md frontmatter.
$schema: https://json-schema.org/draft/2020-12/schema
title: Tool
description: A named set of setup files for one tool, shipped inside bootstrap; a read-only catalog entry.
type: object
properties:
  name:
    type: string
    description: Unique tool name, typed by users in `--tool <name>`, `bootstrap add <name>` and `bootstrap remove <name>`.
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  kind:
    type: string
    description: Whether the tool is always applied (core, cannot be deselected or removed) or user-selected (non-core).
    enum: [core, non-core]
  purpose:
    type: string
    description: One-line tool-neutral description, shown in the init picker and in docs.
    minLength: 1
  files:
    type: array
    description: Target-repository paths this tool renders, relative to the repository root. A path belongs to exactly one tool. The Catalog in index.md is the authority for the 1.0 path set; contents are not part of the contract.
    minItems: 1
    uniqueItems: true
    items:
      type: string
      description: Repository-relative path of a rendered file.
required: [name, kind, purpose, files]
additionalProperties: false
