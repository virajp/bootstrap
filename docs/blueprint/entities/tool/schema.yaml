# Data model for Tool. Governing status lives in index.md frontmatter.
$schema: https://json-schema.org/draft/2020-12/schema
title: Tool
description: A named set of setup files for one tool, shipped inside bootstrap;
  a read-only catalog entry.
type: object
properties:
  name:
    type: string
    description: Unique tool name, typed by users in `--tool <name>`, `bootstrap
      add <name>` and `bootstrap remove <name>`.
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  category:
    type: string
    description: Name of the Tool category this tool belongs to (target entity
      Tool category). Must name an existing category.
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  purpose:
    type: string
    description: One-line description, shown after the tool's name in the tui
      and
      in the docs (for a shown tool). The 1.0 values are in the Catalog table of
      index.md.
    minLength: 1
  removable:
    type: boolean
    description: True when the tool may be removed from a repository; false
      means it is always selected.
  hidden:
    type: boolean
    description: True when the tool is always applied and never shown, recorded
      or accepted by name (index.md invariant 7). True only for `mise`.
    default: false
  default:
    type: string
    description: Whether the tool is in the first-run default selection (init
      with no `--tool`, and the tui first-run view). `on` selects it,
      `off` does not, `origin` selects it when the host of the git remote
      `origin` equals one of `origin_hosts`, compared ignoring case.
    enum: [ "on", "off", "origin" ]
  requires:
    type: array
    description: Slots of tools this tool needs. Each slot lists alternative
      tools, the first being the default; a slot with no selected tool gets its
      first alternative as a dependency. May be empty. Every alternative names a
      tool of the catalog. In 1.0 every slot has exactly one alternative.
    uniqueItems: true
    items:
      type: array
      description: One slot, its alternative tool names; the first is the
        default.
      minItems: 1
      uniqueItems: true
      items:
        type: string
        description: A tool name.
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  origin_hosts:
    type: array
    description: "Hosts of the git remote `origin` that select this tool by default. Required when `default` is `origin`, and present only then. No two `origin` tools of one `max: one` category share a host."
    minItems: 1
    uniqueItems: true
    items:
      type: string
      description: A host name, for example the forge's public host.
      minLength: 1
  files:
    type: array
    description: Target-repository files this tool renders. A path belongs to
      exactly one tool. The Target paths table in index.md is the authority for
      the 1.0 path set; contents are part of the contract only where index.md
      Target paths says so.
    minItems: 1
    uniqueItems: true
    items:
      type: object
      description: One file the tool renders.
      properties:
        path:
          type: string
          description: Repository-relative path of the file.
          minLength: 1
        create_only:
          type: boolean
          description: True when the file is written only when absent, never
            changed or deleted, and reported `kept` (per conventions.md#safety).
            Default false.
          default: false
      required: [ path ]
      additionalProperties: false
required: [
  name,
  category,
  purpose,
  removable,
  default,
  requires,
  files,
]
allOf:
  - if:
      properties:
        hidden:
          const: true
      required: [ hidden ]
    then:
      properties:
        name:
          const: mise
  - if:
      properties:
        removable:
          const: false
      required: [ removable ]
    then:
      properties:
        default:
          const: "on"
  - if:
      properties:
        default:
          const: origin
      required: [ default ]
    else:
      not:
        required: [ origin_hosts ]
  - if:
      properties:
        default:
          const: origin
      required: [ default ]
    then:
      required: [ origin_hosts ]
additionalProperties: false
