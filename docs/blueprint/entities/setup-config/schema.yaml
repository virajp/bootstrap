# Authoritative data model for the setup config, the file persisted in a target
# repository at .config/bootstrap.yaml. Governing status: index.md frontmatter.
$schema: https://json-schema.org/draft/2020-12/schema
title: Setup Config
description: Bootstrap answers recorded for a repository; its presence marks the repository as initialised.
type: object
properties:
  format:
    type: integer
    minimum: 1
    description: Schema version of this file; 1 for bootstrap 1.0. Independent of version; changes only when the file's shape changes.
  version:
    type: string
    description: Semver of the bootstrap version that last wrote the file; rewritten on every write.
    pattern: ^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$
  values:
    type: object
    description: The answers the repository was set up with.
    properties:
      repo:
        type: string
        description: Repository path, one or more owner segments then the name (owner/name or group/subgroup/name); detected from the git remote by default.
        pattern: ^[^/\s]+(/[^/\s]+)+$
      commit_scopes:
        type: array
        description: Allowed commit scopes; may be empty.
        uniqueItems: true
        items:
          type: string
          description: One commit scope, a lowercase kebab-case word.
          pattern: ^[a-z][a-z0-9-]*$
      merge_model:
        type: object
        description: How changes reach each long-lived branch.
        properties:
          develop:
            type: string
            description: How changes reach the develop branch.
            enum: [direct, pr]
          main:
            type: string
            description: How changes reach the main branch.
            enum: [direct, pr]
        required: [develop, main]
        additionalProperties: false
      tools:
        type: array
        description: Selected non-core tools only; core is implicit. Each names a non-core entry of entity Tool.
        uniqueItems: true
        items:
          type: string
          description: Name of a non-core Tool; non-core tool names only, never a core tool name.
    required: [repo, commit_scopes, merge_model, tools]
    additionalProperties: false
  kept:
    type: array
    description: Paths the owner deliberately changed from bootstrap's version. Optional; absent means empty; bootstrap never writes it empty.
    uniqueItems: true
    items:
      type: string
      description: One exact repository-relative file path; no directories, no globs.
  deleted:
    type: array
    description: Paths the owner deliberately left deleted. Optional; absent means empty; bootstrap never writes it empty.
    uniqueItems: true
    items:
      type: string
      description: One exact repository-relative file path; no directories, no globs.
  files:
    type: array
    description: Every path the selected tools produce, excluding .config/bootstrap.yaml itself.
    uniqueItems: true
    items:
      type: string
      description: One exact repository-relative file path; no directories, no globs.
required: [format, version, values, files]
additionalProperties: false
