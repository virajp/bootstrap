# Data model for Group. Governing status lives in index.md frontmatter.
$schema: https://json-schema.org/draft/2020-12/schema
title: Group
description: A named set of setup files shipped inside the tool; a read-only catalog entry.
type: object
properties:
  name:
    type: string
    description: Unique group name, typed by users in `--group <name>` and `bootstrap add <name>`.
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  kind:
    type: string
    description: Whether the group is always applied (core, cannot be deselected) or user-selected (optional).
    enum: [core, optional]
  purpose:
    type: string
    description: One-line human description, shown in the init picker and in docs.
    minLength: 1
  files:
    type: array
    description: Target-repository paths this group renders. A path belongs to exactly one group.
    minItems: 1
    uniqueItems: true
    items:
      type: string
      description: Repository-relative path of a rendered file.
required: [name, kind, purpose, files]
additionalProperties: false
