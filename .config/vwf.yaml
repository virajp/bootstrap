config_format: 22 # this file's own schema version — written 2026-10-05 by /vwf:setup (onboard, code path)
blueprint_format: 25 # the docs/blueprint format stamp — written by the same run

# 2026-10-05 — /vwf:setup onboarded this repo: monorepo of `cli` (the
# @virajp.dev/bootstrap npm package) and `site` (Starlight docs). Neither
# directory exists yet, so every stack axis is `unresolved` — architecture
# decides, setup pins. The repo shape (/vwf:init) was offered and DECLINED:
# bootstrap is the tool meant to replace stackgen's tool-config, so the hand-
# copied .config/ files stay as they are. Unlock: /vwf:setup reshape.

product:
  name: bootstrap

topology: monorepo
topology_reason: One npm CLI (cli/) and its documentation site (site/),
  released together from one pnpm workspace.
ui: true # `site` is a screen platform
integrations: false

stacks: [ stackgen ]

repo:
  stack:
    template: repo/pnpm-workspace
    package_manager: pnpm # from pnpm-lock.yaml
    tools: []

projects:
  cli:
    stack:
      template: project/typescript-effect-cli
      backing_template: []
      deploy_template: [ npm-package ]
      languages: [ typescript ]
      frameworks: [ effect ]
      dependencies: []
      note: Effect CLI chosen over the earlier citty + clack decision
        (2026-10-05).
    cicd: github-actions
  site:
    stack:
      template: project/astro-ssg
      backing_template: []
      deploy_template: [ cloudflare-workers-static ]
      languages: [ typescript ]
      frameworks: [ astro ]
      dependencies: []
    design: claude-code
    cicd: github-actions
    stylesheet: plain-css

harness:
  dev: false # no project exists yet; p:site:dev is a leftover from claude-plugins
  e2e_local: false
  local_stack: false
  e2e_staging: false
  health: n/a # no service platform
  screenshots: false
  goldens: n/a # no device platform
  test:load: false

enforcement:
  rules:
    blueprint/no-vendor-name/tool: {
      waived: true,
      reason: "bootstrap's product is the setup of named tools, so the catalog's tool names and the tools they install are contract (user, 2026-10-08)",
    }
    blueprint/no-vendor-name/tool-category: {
      waived: true,
      reason: "the category catalog lists the named tools of each category (user, 2026-10-08)",
    }
    blueprint/no-vendor-name/setup-config: {
      waived: true,
      reason: "the setup file records named tools (user, 2026-10-08)",
    }
    blueprint/no-vendor-name/cli: {
      waived: true,
      reason: "the cli flows name the tools they set up and their prerequisites (user, 2026-10-08)",
    }
    blueprint/no-vendor-name/site: {
      waived: true,
      reason: "the docs site documents the named tools and the install channels of the cli (user, 2026-10-08)",
    }
  kept_files: {}

memory:
  wing: bootstrap

design:
  design_system_id: docs/design/site/design-system.md # the claude-code canvas; imported by /vwf:design-system 2026-10-06
  flows_rendered:
    - site/110-documentation/site
blueprint:
  coverage: partial # stamped 2026-10-10 by /vwf:blueprint — targeted pass (tool-catalog gaps: mise hidden, replaceable removed, tool purpose in tui, repair/bookkeeping rules); per-doc round 8 left open gaps, coherence round 8 not run
  remaining:
    - entities/setup-config
    - flows/cli/140-add-tool
    - flows/cli/150-remove-tool
    - flows/cli/160-select-tools
    - coherence
    - screens/site/100-home/site
