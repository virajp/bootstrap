# The values of bootstrap for this repository. See docs/sync/index.md of bootstrap.

format = 3

# The bootstrap commit of the last sync. The sync writes it.
bootstrap_commit = "69d33ab8999efe07482df464e97f90e6aa0e09b1"
core_branches = [ "main" ]
environments = [ "dev" ]
repo_name = "bootstrap"
repo_url = "https://github.com/virajp/bootstrap"

[commits]
style = "conventional"

[projects.bootstrap]
folder = "cli"

[release.bootstrap.prod]
tag = "bootstrap@{version}"
type = "tag"
workflow = "release-engine.yml"

[release.bootstrap.local]
task = "p:cli:local"
type = "task"
