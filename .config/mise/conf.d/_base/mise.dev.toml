# Synced from repo-config: tools/base/tool.toml. Do not edit this file.
# The next sync replaces it, and a manual change is lost.

[env]
PRE_COMMIT_HOME = "$HOME/.cache/pre-commit"

[shell_alias]
precommit = "mise run code:precommit"

[tasks]
[tasks.init]
description = "Initialize mise tasks"
dir = "{{exec(command='git rev-parse --show-toplevel')}}"
hide = true
run = "find .config/mise/tasks/ -name '*' -type f -exec chmod 755 {} \\;"

[tools]
[tools.dprint]
version = "latest"
[tools.gitleaks]
version = "latest"
[tools.gomplate]
version = "latest"
[tools.grype]
version = "latest"
[tools.jq]
version = "latest"
[tools."npm:@askviraj/linter"]
depends = [ "node", "pnpm" ]
version = "latest"
[tools.osv-scanner]
version = "latest"
[tools.pre-commit]
depends = [ "python", "uv" ]
version = "latest"
[tools.shellcheck]
version = "latest"
[tools.yq]
version = "latest"
