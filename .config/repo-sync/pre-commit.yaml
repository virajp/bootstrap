# This repository's own pre-commit entries. repo-sync adds them after the
# entries of the tools, in .config/pre-commit-config.yaml.
- repo: local
  hooks:
    - id: test-repo-sync
      name: "Test repo-sync"
      entry: "mise x -- mise run test:repo-sync"
      language: "system"
      files: "^tools/"
      pass_filenames: false
