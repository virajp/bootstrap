# The Cloudflare CLI (npm:cf).
default_envs = [ "dev", "ci" ]
depends = []
extensions = []
root_only = false

# The mise config, generated into .config/mise/conf.d/cloudflare/mise.<env>.toml.
[mise.tools."npm:cf"]
allow_builds = [ "workerd" ]
depends = [ "node", "pnpm" ]
envs = [ "dev", "ci" ]
minimum_release_age = "0h"
version = "latest"
