# Rust and the zola site generator.
default_envs = [ "dev", "ci" ]
depends = []
root_only = false

# The dprint block and plugin of Rust (rustfmt through exec), in dprint.jsonc.
[contributes.dprint]
plugins = [ "npm:@dprint/exec@0.8.0/plugin.json@9d6234ea05810c775f388c2a4cce82b9116b69294b65e0e1e9d64f1446283ef3" ]

# The config files of rustfmt are cache keys: a change of the Rust version or
# of the rustfmt config formats again.
[[contributes.dprint.blocks.exec.commands]]
cacheKeyFiles = [ "rustfmt.toml", "rust-toolchain.toml" ]
command = "mise x -- rustfmt --edition 2024"
exts = [ "rs" ]

# The mise config, generated into .config/mise/conf.d/rust/mise.<env>.toml.

# `default` profile, not `minimal`: `minimal` has no clippy and no rustfmt.
[mise.tools."core:rust"]
envs = [ "dev", "ci" ]
profile = "default"
version = "latest"

[mise.tools.zola]
envs = [ "dev", "ci" ]
version = "latest"
