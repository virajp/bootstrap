# gitleaks: the secret scanner, and code:sec:gitleaks.
default_envs = [ "dev", "ci" ]
depends = [ "_security_base" ]
extensions = []
root_only = false

[files.".config/gitleaks.toml"]
mode = "seed"

# The mise config, generated into .config/mise/conf.d/gitleaks/mise.<env>.toml.
# In dev and ci, because CI runs `code:sec` too.
[mise.tools.gitleaks]
envs = [ "dev", "ci" ]
version = "latest"
