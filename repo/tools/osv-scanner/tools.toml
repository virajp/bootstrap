# osv-scanner: the dependency scanner, and code:sec:30-osv-scanner.
category = "security"
default_envs = [ "dev", "ci" ]
depends = [ "_security_base" ]
description = "osv-scanner examines the dependencies against the OSV vulnerability database. It adds the code:sec:30-osv-scanner task."
root_only = false
summary = "Scans the dependencies with the OSV database"

# The mise config, generated into .config/mise/conf.d/osv-scanner/mise.<env>.toml.
# In dev and ci, because CI runs `code:sec` too.
[mise.tools.osv-scanner]
envs = [ "dev", "ci" ]
version = "latest"

# The files of the tool, below files/.
[files.".config/osv-scanner.toml"]
mode = "seed"
source = ".config/osv-scanner.toml"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."code/sec/30-osv-scanner"]
source = "code-sec-osv-scanner"
