# The Google Cloud CLI, for a repository that deploys to Google Cloud.
category = "cloud"
default_envs = [ "dev", "ci" ]
depends = [ "python" ]
description = "The Google Cloud CLI, for a repository that deploys to Google Cloud. It needs the python tool."
root_only = false
summary = "The Google Cloud CLI"

# The mise config, generated into .config/mise/conf.d/gcloud/mise.<env>.toml.
[mise.tools.gcloud]
envs = [ "dev", "ci" ]
version = "latest"

[mise.env]
# gcloud wants the Python minor version of PYTHON_VERSION in its
# lib/googlecloudsdk/core/updater/python_manager.py: 3.14 for gcloud 585. The
# python tool pins the same version. Without this, gcloud uses the system
# python3 (3.9 on macOS) and fails. Not `latest`: that link moves to each
# newer Python, for example 3.15, and then the gcloud virtual environment in
# ~/.config/gcloud/virtenv runs without its packages.
CLOUDSDK_PYTHON = "{{ xdg_data_home }}/mise/installs/python/3.14/bin/python"
