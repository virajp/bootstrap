# git: the shared .gitignore and .gitattributes, the commit convention, the git-config check, the merge tasks and worktrunk.
category = "core"
default_envs = [ "dev" ]
depends = []
description = "The shared .gitignore and .gitattributes, the commit convention, the git-config check, the merge tasks and worktrunk. Each repository has it."
root_only = false
summary = "The shared git config and the merge tasks"

# Git worktree manager (wt).
[mise.tools.worktrunk]
version = "latest"

# The gate hooks are tool-neutral: each names a task and nothing else.
[[contributes.pre-commit.repos]]
id = "git-config"
repo = "local"

[[contributes.pre-commit.repos.hooks]]
always_run = true
description = "Prevents a local .git/config from overriding global user and signing settings."
entry = "mise x -- mise run code:git-config --fix"
id = "git-config"
language = "system"
name = "Forbidden local git-config"
pass_filenames = false

[[contributes.pre-commit.repos]]
id = "no-commit-to-branch"
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[contributes.pre-commit.repos.hooks]]
args = [ "--branch", "main", "--branch", "develop" ]
description = "These branches take merges only. git runs pre-merge-commit for a merge, so merges are not affected."
id = "no-commit-to-branch"
name = "Refuse a direct commit to a protected branch"

[[contributes.pre-commit.repos]]
id = "conventional-commits"
repo = "https://github.com/qoomon/git-conventional-commits"
rev = "v2.9.0"

[[contributes.pre-commit.repos.hooks]]
args = [ "--config", ".config/git-conventional-commits.yaml" ]
id = "conventional-commits"
name = "Conventional Commits"
stages = [ "commit-msg" ]

# The files of the tool, below files/.
[files.".config/git-conventional-commits.yaml"]
mode = "template"
source = ".config/git-conventional-commits.yaml.tmpl"

[files.".config/wt.toml"]
mode = "seed"
source = ".config/wt.toml"

[files.".gitattributes"]
source = ".gitattributes"

# A shared text file: the lines of the spec merge into it.
[files.".gitignore"]
mode = "merge"
source = "gitignore.merge.toml"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."_scripts/merge"]
library = true
source = "merge"

[tasks."code/git-config"]
source = "code-git-config"

# The merge tasks of the branch pair main and develop. The derive script
# gives branch_pair; code:merge (code/merge/_default of the mise tool) is the
# task of a repository with one of the two branches.
[tasks."code/merge/develop"]
source = "code-merge-develop"
when = "git.branch_pair"

[tasks."code/merge/main"]
source = "code-merge-main"
when = "git.branch_pair"
