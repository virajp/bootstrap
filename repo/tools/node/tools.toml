# Node. A repository with a package.json also selects one package manager: the
# pnpm or the aube tool.
default_envs = [ "dev", "ci" ]
depends = []
extensions = [ "christian-kohler.npm-intellisense", "meganrogge.template-string-converter" ]
root_only = false

# The mise config, generated into .config/mise/conf.d/node/mise.<env>.toml.
[mise.settings]
node.compile = false
npm.package_manager = "aube"

[mise.tools.node]
envs = [ "dev", "ci" ]
version = "lts"

[mise.env]
_.path = { path = "node_modules/.bin", tools = true }

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."setup/deps/40-node"]
source = "setup-deps-node"
