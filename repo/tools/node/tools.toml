# Node and pnpm.
default_envs = [ "dev", "ci" ]
depends = []
extensions = [ "christian-kohler.npm-intellisense", "meganrogge.template-string-converter" ]
root_only = false

# A repository that uses node only as a dev tool has no package.json, and it
# does not get the pnpm settings.
[files."pnpm-workspace.yaml"]
mode = "seed"
requires = [ "package.json" ]

# The mise config, generated into .config/mise/conf.d/node/mise.<env>.toml.
[mise.settings]
node.compile = false
npm.package_manager = "aube"

[mise.tools.node]
envs = [ "dev", "ci" ]
version = "lts"

[mise.tools.pnpm]
depends = [ "node" ]
envs = [ "dev", "ci" ]
version = "latest"

[mise.env]
_.path = { path = "node_modules/.bin", tools = true }

[mise.shell_alias]
npx = "pnpm dlx"
