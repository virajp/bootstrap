# dprint: the formatter of the sync and of code:format, the shared dprint.jsonc
# and setup:dprint.
category = "format-lint"
default_envs = [ "dev", "ci" ]
depends = []
description = "dprint, the formatter of the sync and of code:format, with the shared dprint.jsonc and the setup:dprint task."
root_only = false
summary = "The formatter and the shared dprint.jsonc"

# The base of the shared dprint.jsonc: the top-level settings, the generic
# excludes, the blocks of the base formats and their plugins. A tool adds
# its blocks and plugins in [contributes.dprint]. setup:dprint updates the
# version of each plugin in the file, and the next sync keeps it.
[defaults]
excludes = [ "**/*-lock.yaml", "**/*.svg", "**/package-lock.json" ]
plugins = [
  "npm:@dprint/toml@0.9.0",
  "npm:@dprint/json@0.25.2",
  "npm:@dprint/markdown@0.28.2",
  "npm:dprint-plugin-yaml@0.6.0",
  "npm:@dprint/shuck@0.2.2",
]

[defaults.settings]
newLineKind = "lf"

[defaults.blocks.toml]
"array.preferSingleLine" = true
"array.spaceSurroundingBrackets" = true
"comment.forceLeadingSpace" = false
indentEntries = "never"
indentTables = "never"
"inlineTable.spaceSurroundingBraces" = true
sortArrays = false
sortInlineTables = true
sortKeys = true

[defaults.blocks.json]
jsonTrailingCommaFiles = [ "*.jsonc", ".vscode/settings.json" ]
preferSingleLine = false
trailingCommas = "jsonc"

[defaults.blocks.markdown]
emphasisKind = "asterisks"
strongKind = "asterisks"
textWrap = "maintainAndWrap"

[defaults.blocks.markdown.tags]
bash = "bash"
sh = "sh"
shell = "sh"
zsh = "zsh"

[defaults.blocks.yaml]
bracketSpacing = true
formatComments = true
proseWrap = "always"

# mise task scripts have no file extension, so the shuck plugin does not
# match them by default. Templates (*.tmpl) are not valid shell.
[defaults.blocks.shuck]
associations = [ "**/.config/mise/tasks/**", "!**/*.tmpl" ]
binaryNextLine = true
indentWidth = 2
spaceRedirects = true
switchCaseIndent = true
useTabs = false

# The formatter of the sync: it formats each rendered file before the
# compare. It gets the paths of the files on stdin, one per line.
[formatter]
command = "dprint fmt --no-gitignore --allow-no-files --stdin-files"
configs = [
  "dprint.json",
  "dprint.jsonc",
  ".dprint.json",
  ".dprint.jsonc",
  ".config/dprint.json",
  ".config/dprint.jsonc",
]

# The gate hooks are tool-neutral: each names a task and nothing else. Which
# formatters run is decided inside the task, so a hook and CI cannot drift
# apart. `code:format` runs before `code:lint` and `code:sec` (the pack order),
# because it rewrites the files that they read.
[[contributes.pre-commit.repos]]
id = "format"
repo = "local"

[[contributes.pre-commit.repos.hooks]]
description = "The repo's formatters, run over the files being committed."
entry = "mise x -- mise run code:format --fix"
id = "format"
language = "system"
name = "Format (mise run code:format)"
pass_filenames = true
require_serial = true

# The VS Code extensions of the tool, in .vscode/extensions.json.
[contributes.vscode]
extensions = [ "dprint.dprint" ]

# The mise config, generated into .config/mise/conf.d/dprint/mise.<env>.toml.

# Formatter
[mise.tools.dprint]
envs = [ "dev", "ci" ]
version = "latest"

# The files of the tool, below files/.
# A shared file: the blocks and plugins of the selected tools merge into it.
[files."dprint.jsonc"]
mode = "merge"
source = "dprint.jsonc.merge.toml"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."setup/dprint"]
source = "setup-dprint"

[tasks."code/format/05-dprint"]
source = "code-format-dprint"
