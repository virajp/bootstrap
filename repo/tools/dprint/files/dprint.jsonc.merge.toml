# The merge spec of dprint.jsonc, a shared file. The sync renders it with the
# values of the dprint tool: the base blocks, and the blocks and plugins that
# each selected tool adds in [contributes.dprint]. A key, an exclude or a
# plugin that the user adds stays.
format = "jsonc"

# The file has all its settings now: an older copy extends the global config.
[[item]]
kind = "key"
path = [ "extends" ]
"$mode" = "remove"
<% if .config.settings %>
[[item]]
kind = "keys"
value = <% .config.settings | data.ToTOMLInline %>
<% end -%>
<%- /* The commands of the exec plugin are a list of tables. Each command is
   a block, found by its exts: a new command is added, the command of a tool
   that went is removed, and a command that the user adds stays. The other
   keys of exec are keys, as in each other block. A block without keys, for
   example tailwindcss, still gets its keys item, so the file keeps it. */ -%>
<% range $name, $block := .config.blocks %>
<% $keys := $block -%>
<% if and (eq $name "exec") (has $block "commands") %><% $keys = coll.Omit "commands" $block %><% end -%>
<% if or (ne $name "exec") $keys %>
[[item]]
kind = "keys"
path = [ <% $name | data.ToTOMLInline %> ]
value = <% $keys | data.ToTOMLInline %>
<% end -%>
<% if and (eq $name "exec") (has $block "commands") %>
<% range $block.commands %>
[[item]]
kind = "block"
path = [ "exec", "commands" ]
id = <% conv.Join .exts "," | data.ToTOMLInline %>
match = [ "exts" ]
value = <% . | data.ToTOMLInline %>
<% end -%>
<% end -%>
<% end -%>
<% range .config.excludes %>
[[item]]
kind = "item"
path = [ "excludes" ]
value = <% . | data.ToTOMLInline %>
<% end -%>
<%- /* A plugin is found by its name with any version, so the version that
   setup:dprint writes stays. */ -%>
<% range .config.plugins %>
<% $name := regexp.Replace "^(npm:(@[^/@]+/)?[^@]+)@.*$" "$1" . -%>
[[item]]
kind = "item"
path = [ "plugins" ]
match = <% printf "^%s@" (strings.ReplaceAll "." "\\." $name) | data.ToTOMLInline %>
value = <% . | data.ToTOMLInline %>
<% end -%>
