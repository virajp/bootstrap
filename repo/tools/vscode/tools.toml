# VS Code settings, and the shared extensions.json with the extensions of the
# selected tools. Root only: VS Code opens the root repository. The root does
# not list the extensions of its git submodules.
default_envs = [ "dev" ]
depends = []
root_only = true

# The extensions of the tool. Each selected tool adds its own in
# [contributes.vscode].
[defaults]
extensions = [ "gruntfuggly.todo-tree", "oderwat.indent-rainbow", "pkief.material-icon-theme", "usernamehw.errorlens" ]

# The mise config, generated into .config/mise/conf.d/vscode/mise.dev.toml.

# `code` opens the repository root in its own profile, named $REPO_NAME, also
# from a subdirectory. config_root is conf.d/vscode/, so four dirname go up
# to the root. The shell expands $REPO_NAME, because the template has no env.
[mise.shell_alias]
code = "command code --profile \"$REPO_NAME\" {{config_root | dirname | dirname | dirname | dirname | quote}}"

# The files of the tool, below files/.
# A shared file: the extensions of the selected tools merge into it.
[files.".vscode/extensions.json"]
mode = "merge"
source = ".vscode/extensions.json.merge.toml"

[files.".vscode/settings.json"]
source = ".vscode/settings.json"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."setup/vscode"]
source = "setup-vscode"
