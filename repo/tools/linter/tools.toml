# linter: the house linter and ShellCheck, code:lint and setup:linter.
category = "format-lint"
default_envs = [ "dev", "ci" ]
depends = [ "node" ]
description = "The house linter and ShellCheck, with the code:lint and setup:linter tasks. It needs the node tool."
root_only = false
summary = "The house linter and ShellCheck"

# The gate hooks are tool-neutral: each names a task and nothing else. Which
# linters run is decided inside the task, so a hook and CI cannot drift apart.
[[contributes.pre-commit.repos]]
id = "lint"
repo = "local"

[[contributes.pre-commit.repos.hooks]]
description = "The repo's linters, run over the files being committed."
entry = "mise x -- mise run code:lint --fix"
id = "lint"
language = "system"
name = "Lint (mise run code:lint)"
pass_filenames = true
require_serial = true

# The VS Code extensions of the tool, in .vscode/extensions.json.
[contributes.vscode]
extensions = [ "dbaeumer.vscode-eslint", "foxundermoon.shell-format" ]

# The mise config, generated into .config/mise/conf.d/linter/mise.<env>.toml.

# Linter
[mise.tools."npm:@virajp.dev/linter"]
# The own package of bootstrap: a new release installs at once. Without
# allow_low_downloads, aube refuses a package with few weekly downloads.
allow_low_downloads = true
envs = [ "dev", "ci" ]
minimum_release_age = "0h"
version = "latest"

# Shell linter
[mise.tools.shellcheck]
envs = [ "dev", "ci" ]
version = "latest"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."setup/linter"]
source = "setup-linter"

[tasks."code/lint/05-linter"]
source = "code-lint-linter"
