# The Android SDK command-line tools.
category = "languages"
default_envs = [ "dev", "ci" ]
depends = [ "java" ]
description = "The Android SDK command-line tools. It needs the java tool."
root_only = false
summary = "The Android SDK command-line tools"

# The mise config, generated into .config/mise/conf.d/android/mise.<env>.toml.
[mise.tools.android-sdk]
envs = [ "dev", "ci" ]
version = "23"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."code/lint/10-android"]
source = "code-lint-android"

[tasks."setup/deps/10-android"]
source = "setup-deps-android"
