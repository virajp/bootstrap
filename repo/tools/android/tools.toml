# The Android SDK command-line tools.
category = "languages"
default_envs = [ "dev", "ci" ]
depends = [ "java" ]
description = "The Android SDK command-line tools. It needs the java tool."
root_only = false
summary = "The Android SDK command-line tools"

# The mise config, generated into .config/mise/conf.d/android/mise.<env>.toml.
[mise.tools.android-sdk]
envs = [ "dev", "ci" ]
version = "23"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."code/lint/10-android.py"]
source = "code-lint-android.py"

[tasks."setup/deps/10-android.py"]
source = "setup-deps-android.py"

# The test parts. replaces holds the sha256 of each old copy that a stackgen
# pack wrote at test/e2e or test/golden; bootstrap migrate removes such a copy.
[tasks."test/e2e/40-android.py"]
replaces = [ "sha256:89c566190d9a80d576d57fa04a65bd24a1dfeab10d55756e4881e862cae3aec3" ]
source = "test-e2e-android.py"

[tasks."test/golden/40-android.py"]
replaces = [ "sha256:0de7e36c2b146835ecc14796d4dce0877a930747e2681dd024f2ffd6f2665df8" ]
source = "test-golden-android.py"
