# pre-commit: the shared pre-commit config, its setup task and code:precommit.
default_envs = [ "dev" ]
depends = [ "python" ]
root_only = false

# The first items of the top-level `exclude` of the rendered config.
[defaults]
# Generated files. No hook may rewrite them.
exclude = [ '(^|/)\.config/mise/locks/' ]

[[defaults.repos]]
id = "pre-commit-hooks"
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[defaults.repos.hooks]]
args = [ "--maxkb=1024" ]
id = "check-added-large-files"
name = "Check for added large files (>1MB)"

[[defaults.repos.hooks]]
id = "check-case-conflict"
name = "Check for case-conflicting filenames"

[[defaults.repos.hooks]]
id = "check-illegal-windows-names"
name = "Check for filenames Windows cannot check out"

[[defaults.repos.hooks]]
id = "check-executables-have-shebangs"
name = "Check that executables have shebangs"

[[defaults.repos.hooks]]
id = "check-shebang-scripts-are-executable"
name = "Check that scripts with shebangs are executable"

[[defaults.repos.hooks]]
id = "check-merge-conflict"
name = "Check for merge conflict markers"

[[defaults.repos.hooks]]
id = "check-symlinks"
name = "Check for broken symlinks"

[[defaults.repos.hooks]]
id = "destroyed-symlinks"
name = "Check for destroyed symlinks"

[[defaults.repos.hooks]]
# tsconfig and the VS Code files are JSONC: comments and trailing commas.
exclude = '(^|/)tsconfig[^/]*\.json$|(^|/)\.vscode/'
id = "check-json"
name = "Check JSON syntax"

[[defaults.repos.hooks]]
# A merge spec (*.merge.toml) is a template, not TOML, until the sync renders it.
exclude = '\.merge\.toml$'
id = "check-toml"
name = "Check TOML syntax"

[[defaults.repos.hooks]]
args = [ "--allow-multiple-documents" ]
id = "check-yaml"
name = "Check YAML syntax"

[[defaults.repos.hooks]]
id = "detect-private-key"
name = "Check for committed private keys"

[[defaults.repos.hooks]]
id = "end-of-file-fixer"
name = "Ensure files end with a newline"

[[defaults.repos.hooks]]
id = "trailing-whitespace"
name = "Remove trailing whitespace"

[[defaults.repos.hooks]]
args = [ "--fix=lf" ]
id = "mixed-line-ending"
name = "Normalise line endings to LF"

# The mise config, generated into .config/mise/conf.d/pre-commit/mise.<env>.toml.
[mise.tools.pre-commit]
version = "latest"

[mise.env]
PRE_COMMIT_HOME = "$HOME/.cache/pre-commit"

[mise.shell_alias]
precommit = "mise run code:precommit"

# The files of the tool, below files/.
# A shared file: the spec merges the hooks of the selected tools into it.
[files.".config/pre-commit-config.yaml"]
mode = "merge"
source = ".config/pre-commit-config.yaml.merge.toml"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."code/precommit"]
source = "code-precommit"

[tasks."setup/precommit"]
source = "setup-precommit"
