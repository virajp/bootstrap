# The Kotlin language server (dev only), and the ktlint and detekt gates.
category = "languages"
default_envs = [ "dev" ]
depends = [ "java" ]
description = "The Kotlin language server (dev only), and the ktlint and detekt gates. It needs the java tool."
root_only = false
summary = "Kotlin, with the ktlint and detekt gates"

# The gate lines of the bootstrap section of CLAUDE.md, one for each gate
# task of the tool.
[contributes.claude.claude_md.gates]
"code:format:30-ktlint" = "ktlint checks the layout of the Kotlin files; its seed is `.config/ktlint.editorconfig`: fix the code, not the seed."
"code:lint:30-detekt" = "detekt finds the code smells and the possible bugs in the Kotlin files; its seed is `.config/detekt.yml`: fix the code, not the seed."

# The dependency line of the bootstrap section of CLAUDE.md.
[contributes.claude.claude_md.deps]
kotlin = "Each project needs dependencyLocking { lockAllConfigurations() }; ./gradlew dependencies --write-locks locks only the root and passes on a violation, so write the locks with mise run setup --upgrade, and commit the catalog edit with the lockfiles."

# The mise config, generated into .config/mise/conf.d/kotlin/mise.<env>.toml.
# ktlint is the layout gate, and detekt the correctness gate. detekt-cli runs
# on the JDK of the java tool.
[mise.tools.ktlint]
envs = [ "dev", "ci" ]
version = "latest"

[mise.tools."github:detekt/detekt"]
asset_pattern = "detekt-cli-*.zip"
envs = [ "dev", "ci" ]
version = "latest"

# The language server is for an editor, so it is in dev only. As a
# [mise_env.dev] entry, it does not stop the kotlin tool in ci.
[mise_env.dev.tools."http:kotlin-lsp"]
version = "latest"
version_list_url = "https://api.github.com/repos/Kotlin/kotlin-lsp/releases/latest"
version_regex = 'kotlin-lsp/v(\d+\.\d+\.\d+)'

[mise_env.dev.tools."http:kotlin-lsp".platforms]
macos-arm64 = { checksum_url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}-aarch64.sit.sha256", format = "zip", rename_exe = "kotlin-lsp", url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}-aarch64.sit" }
macos-x64 = { checksum_url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}.sit.sha256", format = "zip", rename_exe = "kotlin-lsp", url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}.sit" }

# The language server of the tool, for bootstrap lsp and code:lsp:check.
[lsp.kotlin-lsp]
args = [ "--stdio" ]
command = "kotlin-lsp"
extensions = { ".kt" = "kotlin", ".kts" = "kotlin" }
source = "http:kotlin-lsp"
startup_timeout = 60000

# The files of the tool, below files/.
[files.".config/detekt.yml"]
mode = "seed"
source = ".config/detekt.yml"

[files.".config/ktlint.editorconfig"]
mode = "seed"
source = ".config/ktlint.editorconfig"

# The kotlin skill, only with the claude tool and its skills = true.
[files.".claude/skills/kotlin/SKILL.md"]
mode = "template"
source = ".claude/skills/kotlin/SKILL.md.tmpl"
when = "claude.skills"

[files.".claude/skills/kotlin/references/conventions.md"]
source = ".claude/skills/kotlin/references/conventions.md"
when = "claude.skills"

# A seed: the repository writes its own rules here.
[files.".claude/skills/kotlin/references/local.md"]
mode = "seed"
source = ".claude/skills/kotlin/references/local.md"
when = "claude.skills"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."code/format/30-ktlint.py"]
source = "code-format-ktlint.py"

[tasks."code/lint/30-detekt.py"]
source = "code-lint-detekt.py"

[tasks."setup/deps/30-kotlin.py"]
source = "setup-deps-kotlin.py"
