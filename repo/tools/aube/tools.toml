# aube, the package manager of a repository that selects it. Select this tool or
# the pnpm tool, not both.
category = "package-managers"
default_envs = [ "dev", "ci" ]
depends = [ "node" ]
description = "aube, the package manager of a repository that selects it. Select this tool or the pnpm tool, not both. It needs the node tool."
parent = "node"
root_only = false
summary = "The aube package manager for Node"

# A repository without a package.json does not get the aube settings.
# The mise config, generated into .config/mise/conf.d/aube/mise.<env>.toml.
[mise.tools.aube]
envs = [ "dev", "ci" ]
version = "latest"

[mise.shell_alias]
npx = "aubx"

# The files of the tool, below files/.
[files."aube-workspace.yaml"]
mode = "seed"
requires = [ "package.json" ]
source = "aube-workspace.yaml"
