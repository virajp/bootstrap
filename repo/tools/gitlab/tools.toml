# GitLab: the glab CLI, and the issue and merge request templates.
default_envs = [ "dev", "ci" ]
depends = []
root_only = false

# `glab ci lint` asks the GitLab API, so it needs the network and `glab auth`.
[[contributes.pre-commit.repos]]
id = "glab-ci-lint"
repo = "local"

[[contributes.pre-commit.repos.hooks]]
entry = "mise x -- glab ci lint"
files = '^\.gitlab-ci\.yml$'
id = "glab-ci-lint"
language = "system"
name = "Lint the GitLab CI config (glab ci lint)"
pass_filenames = false

# The VS Code extensions of the tool, in .vscode/extensions.json.
[contributes.vscode]
extensions = [ "gitlab.gitlab-workflow" ]

# The mise config, generated into .config/mise/conf.d/gitlab/mise.<env>.toml.

# GitLab CLI: issues, merge requests, `glab ci lint`, and `code:merge` under
# the `pr` model
[mise.tools.glab]
envs = [ "dev", "ci" ]
version = "latest"

# The files of the tool, below files/.
[files.".gitlab/issue_templates/Bug.md"]
source = ".gitlab/issue_templates/Bug.md"

[files.".gitlab/issue_templates/Feature.md"]
source = ".gitlab/issue_templates/Feature.md"

[files.".gitlab/merge_request_templates/Default.md"]
source = ".gitlab/merge_request_templates/Default.md"
