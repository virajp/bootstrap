# Swift and SwiftPM from the host (macOS only): Xcode for a root with an
# .xcodeproj, else the Command Line Tools. Also the SwiftLint and swift-format
# gates, and the Xcode and simulator lookup of _scripts/xcode.
category = "languages"
default_envs = [ "dev" ]
depends = []
description = "Swift and SwiftPM from the host: Xcode for a root with an .xcodeproj, else the Command Line Tools. Also the SwiftLint and swift-format gates. macOS only."
hosts = [ "macos" ]
root_only = false
summary = "Swift, SwiftLint and swift-format (macOS)"

# The VS Code extensions of the tool, in .vscode/extensions.json.
[contributes.vscode]
extensions = [ "swiftlang.swift-vscode" ]

# The mise config, generated into .config/mise/conf.d/swift/mise.<env>.toml.
# SwiftLint is the correctness gate. swift-format comes with the Swift
# toolchain of the host, so it has no mise tool.
[mise.tools.swiftlint]
envs = [ "dev", "ci" ]
version = "latest"

# Swift needs a macOS host, also in CI. The mise tool sets os = "linux" for
# ci, and conf.d/swift/ loads after conf.d/mise/, so this value wins. Thus each
# CI job of a repository with swift in ci runs on a macOS runner.
[mise_env.ci.settings]
os = "macos"

# The files of the tool, below files/.
[files.".config/swift-format.json"]
mode = "seed"
source = ".config/swift-format.json"

[files.".config/swiftlint.yml"]
mode = "seed"
source = ".config/swiftlint.yml"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."_scripts/xcode"]
library = true
source = "xcode"

[tasks."code/format/50-swift-format"]
source = "code-format-swift-format"

[tasks."code/lint/80-swiftlint"]
source = "code-lint-swiftlint"

[tasks."setup/deps/60-swift"]
source = "setup-deps-swift"
