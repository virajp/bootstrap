# Swift and SwiftPM from the host (macOS only): Xcode for a root with an
# .xcodeproj, else the Command Line Tools. Also the SwiftLint and swift-format
# gates, and the Xcode and simulator lookup of _scripts/xcode.py.
category = "languages"
default_envs = [ "dev" ]
depends = []
description = "Swift and SwiftPM from the host: Xcode for a root with an .xcodeproj, else the Command Line Tools. Also the SwiftLint and swift-format gates. macOS only."
hosts = [ "macos" ]
root_only = false
summary = "Swift, SwiftLint and swift-format (macOS)"

# The VS Code extensions of the tool, in .vscode/extensions.json.
[contributes.vscode]
extensions = [ "swiftlang.swift-vscode" ]

# The gate lines of the bootstrap section of CLAUDE.md, one for each gate
# task of the tool.
[contributes.claude.claude_md.gates]
"code:format:50-swift-format" = "swift-format checks the layout of the Swift files in strict mode; its seed is `.config/swift-format.json`: fix the code, not the seed."
"code:lint:80-swiftlint" = "SwiftLint lints the Swift files in strict mode; its seed is `.config/swiftlint.yml`: fix the code, not the seed. Never run swiftlint --fix; swift-format owns the layout."

# The dependency line of the bootstrap section of CLAUDE.md.
[contributes.claude.claude_md.deps]
swift = "The Package.resolved inside .xcodeproj belongs to Xcode: change it only with mise run setup or mise run setup --upgrade. SwiftPM has no audit command: read the revision diff of Package.resolved by hand."

# The mise config, generated into .config/mise/conf.d/swift/mise.<env>.toml.
# SwiftLint is the correctness gate. swift-format comes with the Swift
# toolchain of the host, so it has no mise tool.
[mise.tools.swiftlint]
envs = [ "dev", "ci" ]
version = "latest"

# Swift needs a macOS host, also in CI. The mise tool sets os = "linux" for
# ci, and conf.d/swift/ loads after conf.d/mise/, so this value wins. Thus each
# CI job of a repository with swift in ci runs on a macOS runner.
[mise_env.ci.settings]
os = "macos"

# The language server of the tool, for bootstrap lsp and code:lsp:check.
# sourcekit-lsp comes with the Swift toolchain of the host.
[lsp.sourcekit-lsp]
command = "sourcekit-lsp"
extensions = { ".swift" = "swift" }
source = "host"
startup_timeout = 1000

# The files of the tool, below files/.
[files.".config/swift-format.json"]
mode = "seed"
source = ".config/swift-format.json"

[files.".config/swiftlint.yml"]
mode = "seed"
source = ".config/swiftlint.yml"

# The swift skill, only with the claude tool and its skills = true.
[files.".claude/skills/swift/SKILL.md"]
mode = "template"
source = ".claude/skills/swift/SKILL.md.tmpl"
when = "claude.skills"

[files.".claude/skills/swift/references/conventions.md"]
source = ".claude/skills/swift/references/conventions.md"
when = "claude.skills"

# A seed: the repository writes its own rules here.
[files.".claude/skills/swift/references/local.md"]
mode = "seed"
source = ".claude/skills/swift/references/local.md"
when = "claude.skills"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."_scripts/xcode.py"]
library = true
source = "xcode.py"

[tasks."code/format/50-swift-format.py"]
source = "code-format-swift-format.py"

[tasks."code/lint/80-swiftlint.py"]
source = "code-lint-swiftlint.py"

[tasks."setup/deps/60-swift.py"]
source = "setup-deps-swift.py"

# The test part. replaces holds the sha256 of each old copy that a stackgen
# pack wrote at test/golden; bootstrap migrate removes such a copy.
[tasks."test/golden/40-swift.py"]
replaces = [
  "sha256:86af8af894928c89501f7d0a7aa80775d33eb610de93c96e267a96acee746c6d",
  "sha256:7635425e60da25d59f253194ad23aef63d150ff7dc3032f576d9a943ca40090e",
  "sha256:03583d308c5a49cc3fa840243fb15281eddf6788ed9f1743aef0572e41f80239",
  "sha256:dcb125b4820f844eb07c20a28d830cbbd7103d684708a2994e4d5ecca90a9b69",
  "sha256:53f96e8dd862070702b7c813b1a7c11d53e3a07de8f22d21a7c1257769380ccb",
]
source = "test-golden-swift.py"
