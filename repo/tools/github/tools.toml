# GitHub: the gh CLI, actionlint, and the issue and pull request templates.
category = "forge"
default_envs = [ "dev", "ci" ]
depends = []
description = "The gh CLI, actionlint for the GitHub Actions workflows, and the issue and pull request templates."
root_only = false
summary = "The gh CLI, actionlint and GitHub templates"

[[contributes.pre-commit.repos]]
id = "actionlint"
repo = "local"

[[contributes.pre-commit.repos.hooks]]
entry = "mise x -- actionlint"
files = '^\.github/workflows/.*\.ya?ml$'
id = "actionlint"
language = "system"
name = "Lint GitHub Actions workflows (actionlint)"
pass_filenames = true

# The VS Code extensions of the tool, in .vscode/extensions.json.
[contributes.vscode]
extensions = [ "github.vscode-github-actions" ]

# The mise config, generated into .config/mise/conf.d/github/mise.<env>.toml.

# GitHub CLI: issues, pull requests, and `code:merge` under the `pr` model
[mise.tools.gh]
envs = [ "dev", "ci" ]
version = "latest"

# GitHub Actions workflow linter
[mise.tools.actionlint]
envs = [ "dev", "ci" ]
version = "latest"

# The files of the tool, below files/.
[files.".github/ISSUE_TEMPLATE/bug_report.yml"]
source = ".github/ISSUE_TEMPLATE/bug_report.yml"

[files.".github/ISSUE_TEMPLATE/config.yml"]
mode = "template"
source = ".github/ISSUE_TEMPLATE/config.yml.tmpl"

[files.".github/ISSUE_TEMPLATE/feature_request.yml"]
source = ".github/ISSUE_TEMPLATE/feature_request.yml"

[files.".github/pull_request_template.md"]
source = ".github/pull_request_template.md"
