# Flutter and Dart. Needs android-sdk, from the android tool.
default_envs = [ "dev", "ci" ]
depends = []
extensions = [ "dart-code.dart-code", "dart-code.flutter" ]
root_only = false

# The mise config, generated into .config/mise/conf.d/flutter/mise.<env>.toml.
[mise.tools.flutter]
depends = [ "android-sdk" ]
envs = [ "dev", "ci" ]
version = "3"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."code/format/10-dart"]
source = "code-format-dart"

[tasks."code/lint/20-dart"]
source = "code-lint-dart"

[tasks."setup/deps/20-flutter"]
source = "setup-deps-flutter"
