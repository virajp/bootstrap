# Flutter and Dart. Needs android-sdk, from the android tool.
category = "languages"
default_envs = [ "dev", "ci" ]
depends = [ "android" ]
description = "Flutter and Dart. It needs the android tool for the Android SDK."
root_only = false
summary = "Flutter and Dart"

# The VS Code extensions of the tool, in .vscode/extensions.json.
[contributes.vscode]
extensions = [ "dart-code.dart-code", "dart-code.flutter" ]

# The gate lines of the bootstrap section of CLAUDE.md, one for each gate
# task of the tool.
[contributes.claude.claude_md.gates]
"code:format:10-dart" = "dart format checks the layout of the Dart files."
"code:lint:20-dart" = "dart analyze examines the Dart files, and each finding fails the gate, also an info."

# The dependency line of the bootstrap section of CLAUDE.md.
[contributes.claude.claude_md.deps]
flutter = "mise run setup --upgrade deletes pubspec.lock and runs pub upgrade --major-versions: it re-resolves every package. After an edit of pubspec.yaml, run mise run setup and commit both files."

# The mise config, generated into .config/mise/conf.d/flutter/mise.<env>.toml.
[mise.tools.flutter]
envs = [ "dev", "ci" ]
version = "3"

# The language server of the tool, for bootstrap lsp and code:lsp:check. The
# dart command comes with flutter.
[lsp.dart-lsp]
args = [ "language-server", "--protocol=lsp" ]
command = "dart"
extensions = { ".dart" = "dart" }
source = "flutter"
startup_timeout = 60000

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."code/format/10-dart.py"]
source = "code-format-dart.py"

[tasks."code/lint/20-dart.py"]
source = "code-lint-dart.py"

[tasks."setup/deps/20-flutter.py"]
source = "setup-deps-flutter.py"
