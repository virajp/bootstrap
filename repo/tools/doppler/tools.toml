# The Doppler CLI and setup:secrets:10-doppler. A repository selects it only when
# it keeps its secrets in Doppler.
default_envs = [ "dev" ]
depends = []
extensions = []
root_only = false

# The mise config, generated into .config/mise/conf.d/doppler/mise.<env>.toml.
# Only dev: ci has its own secret management.
[mise.tools.doppler]
version = "latest"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."setup/secrets/10-doppler"]
source = "setup-secrets-doppler"
