# Python and uv. dprint formats the Python files. In a repository with a
# pyproject.toml, also ruff and pyrefly, with their code:lint tasks: ruff lints
# and pyrefly checks the types of the Python files.
category = "languages"
default_envs = [ "dev", "ci" ]
depends = []
description = "Python and uv. dprint formats the Python files. In a repository with a pyproject.toml, also ruff (lint) and pyrefly (types), with their code:lint tasks."
root_only = false
summary = "Python and uv, with ruff lint and pyrefly types"

# The VS Code extensions of the tool, in .vscode/extensions.json.
[contributes.vscode]
extensions = [ "meta.pyrefly" ]

# The dprint block and plugin of Python (ruff), in dprint.jsonc. dprint is the
# one formatter of the Python files.
[contributes.dprint]
plugins = [ "npm:@dprint/ruff@0.11.3" ]

[contributes.dprint.blocks.ruff]
indentWidth = 2
lineLength = 120

# The gate lines of the bootstrap section of CLAUDE.md, one for each gate
# task of the tool.
[contributes.claude.claude_md.gates]
"code:lint:50-pyrefly" = "pyrefly checks the types of the Python files, in a repository with a `pyproject.toml`."
"code:lint:70-ruff" = "ruff lints the Python files, in a repository with a `pyproject.toml`."
"code:lint:90-uv" = "each `uv.lock` must agree with its `pyproject.toml`."

# The dependency line of the bootstrap section of CLAUDE.md.
[contributes.claude.claude_md.deps]
python = "Python comes from mise: never run uv python install and never pin a Python version in uv; use uv sync --locked through mise run setup, never --frozen by hand."

# The mise config, generated into .config/mise/conf.d/python/mise.<env>.toml.
[mise.settings]
pipx.uvx = true
python.compile = false
python.uv_venv_auto = "create|source"

# CLOUDSDK_PYTHON of the gcloud tool, python@3.14 in gate_files of helpers (the
# mise tool) and the two version lines of each Python library of _scripts/ use
# the same version. Change all of them together: docs/sync/tools/python.md
# lists each place.
[mise.tools.python]
envs = [ "dev", "ci" ]
version = "3.14"

[mise.tools.uv]
envs = [ "dev", "ci" ]
version = "latest"

# The lint and type gates of a Python project. Many repositories have python
# only for the tools of other bootstrap tools or for the task files, so the
# sync installs these two, and writes their tasks, only when requires_found
# finds a pyproject.toml.
[mise.tools.ruff]
envs = [ "dev", "ci" ]
requires_found = [ "pyproject.toml" ]
version = "latest"

[mise.tools."pipx:pyrefly"]
envs = [ "dev", "ci" ]
requires_found = [ "pyproject.toml" ]
version = "latest"

[mise.env]
UV_NO_MANAGED_PYTHON = true
UV_PYTHON_DOWNLOADS = "never"

# The language server of the tool, for bootstrap lsp and code:lsp:check:
# pyrefly, from the pin above, so only with a pyproject.toml.
[lsp.pyrefly]
args = [ "lsp" ]
command = "pyrefly"
extensions = { ".py" = "python", ".pyi" = "python" }
source = "pipx:pyrefly"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."code/lint/50-pyrefly.py"]
requires_found = [ "pyproject.toml" ]
source = "code-lint-pyrefly.py"

[tasks."code/lint/70-ruff.py"]
requires_found = [ "pyproject.toml" ]
source = "code-lint-ruff.py"

[tasks."code/lint/90-uv.py"]
source = "code-lint-uv.py"

[tasks."setup/deps/50-python.py"]
source = "setup-deps-python.py"
