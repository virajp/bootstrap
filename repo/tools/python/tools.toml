# Python and uv. In a repository with a pyproject.toml, also ruff and pyrefly,
# with their code:lint and code:format tasks.
default_envs = [ "dev", "ci" ]
depends = []
root_only = false

# The VS Code extensions of the tool, in .vscode/extensions.json.
[contributes.vscode]
extensions = [ "meta.pyrefly" ]

# The dprint block and plugin of Python (ruff), in dprint.jsonc.
[contributes.dprint]
plugins = [ "npm:@dprint/ruff@0.11.3" ]

[contributes.dprint.blocks.ruff]
indentWidth = 2
lineLength = 120

# The mise config, generated into .config/mise/conf.d/python/mise.<env>.toml.
[mise.settings]
pipx.uvx = true
python.compile = false
python.uv_venv_auto = "create|source"

# CLOUDSDK_PYTHON of the gcloud tool uses the same minor version. Change both.
[mise.tools.python]
envs = [ "dev", "ci" ]
version = "3.14"

[mise.tools.uv]
envs = [ "dev", "ci" ]
version = "latest"

# The gates of a Python project. Many repositories have python only for the
# tools of other bootstrap tools, so the sync installs these two, and writes
# their tasks, only when requires_found finds a pyproject.toml.
[mise.tools.ruff]
envs = [ "dev", "ci" ]
requires_found = [ "pyproject.toml" ]
version = "latest"

[mise.tools."pipx:pyrefly"]
envs = [ "dev", "ci" ]
requires_found = [ "pyproject.toml" ]
version = "latest"

[mise.env]
UV_NO_CACHE = true
UV_NO_MANAGED_PYTHON = true
UV_PYTHON_DOWNLOADS = "never"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."code/format/40-ruff"]
requires_found = [ "pyproject.toml" ]
source = "code-format-ruff"

[tasks."code/lint/50-pyrefly"]
requires_found = [ "pyproject.toml" ]
source = "code-lint-pyrefly"

[tasks."code/lint/70-ruff"]
requires_found = [ "pyproject.toml" ]
source = "code-lint-ruff"

[tasks."code/lint/90-uv"]
source = "code-lint-uv"

[tasks."setup/deps/50-python"]
source = "setup-deps-python"
