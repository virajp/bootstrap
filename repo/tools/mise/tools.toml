# mise: the shared mise config, the task library and the setup and code orchestrators.
default_envs = [ "dev", "ci" ]
depends = []
extensions = [ "hverlin.mise-vscode", "redhat.vscode-yaml", "tamasfe.even-better-toml" ]
root_only = false

# The mise config, generated into .config/mise/conf.d/mise/mise.<env>.toml.

# JSON and YAML queries. In dev and ci, because the tasks use them in both.
[mise.tools.jq]
envs = [ "dev", "ci" ]
version = "latest"

[mise.tools.yq]
envs = [ "dev", "ci" ]
version = "latest"

[mise.shell_alias]
precommit = "mise run code:precommit"
setup = "mise run setup"
worktrees = "mise run code:worktrees"

[mise.tasks.init]
description = "Initialize mise tasks"
dir = "{{exec(command='git rev-parse --show-toplevel')}}"
hide = true
run = "find .config/mise/tasks/ -name '*' -type f -exec chmod 755 {} \\;"

# dev run on macOS
# selects macOS binaries.
[mise_env.dev.settings]
os = "macos"

# CI run on Linux
# selects Linux binaries.
[mise_env.ci.settings]
os = "linux"

# The files of the tool, below files/.
[files.".config/mise.toml"]
mode = "template"
source = ".config/mise.toml.tmpl"

[files.".config/mise/conf.d/zz-repo/mise.ci.toml"]
mode = "seed"
source = ".config/mise/conf.d/zz-repo/mise.ci.toml"

[files.".config/mise/conf.d/zz-repo/mise.dev.toml"]
mode = "seed"
source = ".config/mise/conf.d/zz-repo/mise.dev.toml"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."_scripts/checks"]
library = true
source = "checks"

[tasks."_scripts/helpers"]
library = true
source = "helpers"

[tasks."_scripts/placeholder"]
library = true
source = "placeholder"

[tasks."_scripts/worktrees-page"]
library = true
source = "worktrees-page"

[tasks."code/_default"]
source = "code"

[tasks."code/format/_default"]
mode = "template"
source = "code-format.tmpl"

[tasks."code/lint/_default"]
mode = "template"
source = "code-lint.tmpl"

[tasks."code/merge/_default"]
source = "code-merge"

[tasks."code/sec/_default"]
source = "code-sec"

[tasks."code/worktrees"]
source = "code-worktrees"

[tasks."setup/_default"]
mode = "template"
source = "setup.tmpl"

[tasks."setup/configs/_default"]
mode = "template"
source = "setup-configs.tmpl"

[tasks."setup/mise"]
source = "setup-mise"

[tasks."setup/worktree"]
mode = "template"
source = "setup-worktree.tmpl"
