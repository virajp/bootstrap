# mise: the shared mise config, the task library, the setup and code
# orchestrators, and the entry of the sync: setup:configs and the gate
# code:lint:60-bootstrap.
category = "core"
default_envs = [ "dev", "ci" ]
depends = []
description = "The shared mise config, the task library, the setup and code orchestrators, and the entry of the sync: setup:configs and the gate code:lint:60-bootstrap. Each repository has it."
root_only = false
summary = "The mise config, the tasks and the sync entry"

# The global file lists of the code:format and code:lint gates. The sync
# renders them to .config/bootstrap/config-files.toml, which gate_files of
# helpers reads. An empty includes means every file. Another tool adds
# patterns in [contributes.mise], and a repository in [tools.mise] of
# .config/bootstrap/tools.toml.
[defaults.code_files]
excludes = [ "**/*-lock.yaml", "**/*.svg", "**/package-lock.json" ]
includes = []

# The VS Code extensions of the tool, in .vscode/extensions.json.
[contributes.vscode]
extensions = [ "hverlin.mise-vscode", "redhat.vscode-yaml", "tamasfe.even-better-toml" ]

# The mise config, generated into .config/mise/conf.d/mise/mise.<env>.toml.

# JSON and YAML queries. In dev and ci, because the tasks use them in both.
[mise.tools.jq]
envs = [ "dev", "ci" ]
version = "latest"

[mise.tools.yq]
envs = [ "dev", "ci" ]
version = "latest"

[mise.shell_alias]
precommit = "mise run code:precommit"
setup = "mise run setup"
worktrees = "mise run git:worktree:list"

[mise.tasks.init]
description = "Initialize mise tasks"
dir = "{{exec(command='git rev-parse --show-toplevel')}}"
hide = true
run = "find .config/mise/tasks/ -name '*' -type f -exec chmod 755 {} \\;"

# The CLI of the sync, in dev only. setup:configs and code:lint:60-bootstrap
# run it. Its release tags are bootstrap@X.Y.Z, and mise shows bootstrap@2.0.2
# as 2.0.2.
[mise_env.dev.tools."github:virajp/bootstrap"]
version = "latest"

# dev run on macOS
# selects macOS binaries.
[mise_env.dev.settings]
os = "macos"

# CI run on Linux
# selects Linux binaries. A CI that also loads dev (MISE_ENV=dev,ci) gets the
# dev pin of bootstrap, so disable_tools keeps the CLI out of CI: bootstrap is
# for a developer machine only, and a task that runs in CI reads a value with
# tool_value of helpers.py.
[mise_env.ci.settings]
disable_tools = [ "github:virajp/bootstrap" ]
os = "linux"

# The files of the tool, below files/.
[files.".config/bootstrap/config-files.toml"]
mode = "template"
source = ".config/bootstrap/config-files.toml.tmpl"

[files.".config/mise.toml"]
mode = "template"
source = ".config/mise.toml.tmpl"

[files.".config/mise/conf.d/zz-repo/mise.ci.toml"]
mode = "seed"
source = ".config/mise/conf.d/zz-repo/mise.ci.toml"

[files.".config/mise/conf.d/zz-repo/mise.dev.toml"]
mode = "seed"
source = ".config/mise/conf.d/zz-repo/mise.dev.toml"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."_scripts/checks.py"]
library = true
source = "checks.py"

[tasks."_scripts/gate_files.py"]
library = true
source = "gate_files.py"

[tasks."_scripts/helpers.py"]
library = true
source = "helpers.py"

[tasks."_scripts/placeholder.py"]
library = true
source = "placeholder.py"

[tasks."_scripts/worktrees_page.py"]
library = true
source = "worktrees_page.py"

[tasks."code/_default.py"]
source = "code.py"

[tasks."code/format/_default.py"]
mode = "template"
source = "code-format.py.tmpl"

[tasks."code/lint/_default.py"]
mode = "template"
source = "code-lint.py.tmpl"

[tasks."code/lint/60-bootstrap.py"]
source = "code-lint-bootstrap.py"

[tasks."code/lsp/check.py"]
source = "code-lsp-check.py"

[tasks."code/sec/_default.py"]
source = "code-sec.py"

[tasks."git/worktree/list.py"]
source = "code-worktrees.py"

[tasks."git/worktree/setup.py"]
mode = "template"
source = "setup-worktree.py.tmpl"

[tasks."setup/_default.py"]
mode = "template"
source = "setup.py.tmpl"

[tasks."setup/configs/_default.py"]
mode = "template"
source = "setup-configs.py.tmpl"

[tasks."setup/mise.py"]
source = "setup-mise.py"

[tasks."test/_default.py"]
source = "test.py"

[tasks."test/e2e/_default.py"]
source = "test-e2e.py"

[tasks."test/golden/_default.py"]
source = "test-golden.py"
