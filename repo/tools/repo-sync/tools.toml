# repo-sync: the setup:configs tasks and the gate code:lint:60-repo-sync.
default_envs = [ "dev" ]
depends = []
extensions = []
root_only = false

# The mise config, generated into .config/mise/conf.d/repo-sync/mise.<env>.toml.

# Template renderer for `setup:configs`. Declared here too, because `mise prune`
# keeps only the tools that a config file names, not a task header.
[mise.tools.gomplate]
version = "latest"

# The task files of the tool, below tasks/. The key is the path below
# .config/mise/tasks/.
[tasks."code/lint/60-repo-sync"]
source = "code-lint-repo-sync"
