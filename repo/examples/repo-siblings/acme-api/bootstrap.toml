# Example: the sibling ../acme-api of the base repository acme-product. It is
# a python polyrepo with the branch main only.

# The bootstrap commit of the last sync. The sync writes it.
bootstrap_commit = ""
# The mise environments: dev (necessary) and ci.
environments = [ "dev", "ci" ]
format = 2
# The product name, for the fnox keychain service.
product_name = "acme"
repo_name = "acme-api"
# The web URL of the repository, for the github tool.
repo_url = "https://github.com/example/acme-api"

[tools.git]
# The commit scopes of git-conventional-commits.
commit_scopes = [ "api", "worker" ]

[tools.mise]
# The gitignored files to copy into a new worktree.
worktree_files = [ ".config/mise.local.toml", ".env" ]

[tools.pre-commit]

[tools.dprint]

[tools.linter]

[tools.gitleaks]

[tools.grype]

[tools.osv-scanner]

[tools.claude]

[tools.github]

[tools.python]
# A feature branch merges into main through a pull request.
[tools.git.branch.main]
merge_model = "pr"
