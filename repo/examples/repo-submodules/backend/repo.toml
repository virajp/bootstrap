# Example: the submodule backend. It is a node monorepo with the branches main
# and develop.

format = 3

# The bootstrap commit of the last sync. The sync writes it.
bootstrap_commit = ""
# The core branches, in order. Each one exists in git.
core_branches = [ "main", "develop" ]
# The mise environments: dev (necessary) and ci.
environments = [ "dev", "ci" ]
# The product name, for the fnox keychain service.
product_name = "acme"
repo_name = "acme-backend"
# The web URL of the repository, for the github tool.
repo_url = "https://github.com/example/acme-backend"

# A feature branch merges into develop. main never merges into develop.
[branches.develop]
landing = "direct-merge"
merge_never = [ "main" ]

# Only develop merges into main, through a pull request.
[branches.main]
landing = "pr"
merge_from = [ "develop" ]

[commits]
# The commit scopes of git-conventional-commits. The default is the names of
# the [members.*] tables.
scopes = [ "common", "deps", "service", "worker" ]

[worktree]
# The gitignored files to copy into a new worktree.
files = [ ".config/mise.local.toml", ".env" ]

# The home repository of this submodule. The sync of the home writes it.
[home]
folder = ".."
type = "submodule"
url = "https://github.com/example/acme"

# The folder members. A folder member is part of the root tree.
[members.common]
folder = "packages/common"
label = "Common"
type = "folder"

[members.service]
folder = "projects/service"
label = "Service"
type = "folder"

[members.worker]
folder = "projects/worker"
label = "Worker"
type = "folder"
