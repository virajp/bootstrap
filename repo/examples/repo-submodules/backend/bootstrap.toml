# Example: the submodule backend. It is a node monorepo with the branches main
# and develop.

# The bootstrap commit of the last sync. The sync writes it.
bootstrap_commit = ""
# The mise environments: dev (necessary) and ci.
environments = [ "dev", "ci" ]
# The product name, for the fnox keychain service.
product_name = "acme"
repo_name = "acme-backend"
# The web URL of the repository, for the github tool.
repo_url = "https://github.com/example/acme-backend"

[tools.git]
# The commit scopes of git-conventional-commits. The default is the member
# list.
commit_scopes = [ "common", "deps", "service", "worker" ]

[tools.mise]
# The gitignored files to copy into a new worktree.
worktree_files = [ ".config/mise.local.toml", ".env" ]

[tools.node]
env = [ "dev", "ci" ]

[tools.pnpm]
env = [ "dev", "ci" ]

# Override the defaults of the tools. The path after overrides is the path in
# repo/tools/<tool>/tools.toml.
[overrides.mise.tools.node]
version = "22"

# A feature branch merges into develop. main never merges into develop.
[tools.git.branch.develop]
merge_model = "direct"
merge_never = [ "main" ]

# Only develop merges into main, through a pull request.
[tools.git.branch.main]
merge_from = [ "develop" ]
merge_model = "pr"

# The folder members. A folder member is part of the root tree.
[member.common]
folder = "packages/common"
label = "Common"
type = "folder"

[member.service]
folder = "projects/service"
label = "Service"
type = "folder"

[member.worker]
folder = "projects/worker"
label = "Worker"
type = "folder"
