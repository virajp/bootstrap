# Example: the root repository of a product with three git submodules.
# It is a polyrepo with the branch develop only. See the folders of the
# submodules for their own values files.

format = 3

# The bootstrap commit of the last sync. The sync writes it.
bootstrap_commit = ""
# The core branches, in order. Each one exists in git.
core_branches = [ "develop" ]
# The mise environments: dev (necessary) and ci.
environments = [ "dev", "ci" ]
# The product name, for the fnox keychain service. Each submodule has the
# same value.
product_name = "acme"
repo_name = "acme"
# The web URL of the repository, for the github tool.
repo_url = "https://github.com/example/acme"

# A feature branch merges into develop. main never merges into develop.
[branches.develop]
landing = "direct-merge"
merge_never = [ "main" ]

[commits]
# The commit scopes of git-conventional-commits. The default is the names of
# the [members.*] tables.
scopes = [ "backend", "frontend", "iac", "docs" ]

[worktree]
# The gitignored files to copy into a new worktree.
files = [ ".config/mise.local.toml", "docs/memory/handoff" ]

# The submodule members, each with the url of its repository.
# git:worktree:setup runs worktree_install in each submodule.
[members.backend]
label = "Backend"
type = "submodule"
url = "https://github.com/example/acme-backend"
worktree_install = "mise run git:worktree:setup"

[members.frontend]
label = "Frontend"
type = "submodule"
url = "https://github.com/example/acme-frontend"
worktree_install = "mise run git:worktree:setup"

[members.iac]
label = "Infrastructure"
type = "submodule"
url = "https://github.com/example/acme-iac"
worktree_install = "mise run git:worktree:setup"
