# Example: a polyrepo with the branch main only.
# Feature branches merge into main.

# The bootstrap commit of the last sync. The sync writes it.
bootstrap_commit = ""
# The mise environments: dev (necessary) and ci.
environments = [ "dev", "ci" ]
repo_name = "billing-cli"
# The web URL of the repository, for the github tool.
repo_url = "https://github.com/example/billing-cli"

[tools.git]
# The commit scopes of git-conventional-commits.
commit_scopes = [ "cli", "docs" ]

[tools.mise]
# The gitignored files to copy into a new worktree.
worktree_files = [ ".config/mise.local.toml" ]

# A feature branch merges into main, through a pull request. The branch
# gh-pages never merges into main.
[tools.git.branch.main]
merge_model = "pr"
merge_never = [ "gh-pages" ]
